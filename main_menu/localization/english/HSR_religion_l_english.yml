l_english:
 Aeons: "Paths"
 Destruction_Worship: "Destruction"
 Destruction_Worship_ADJ: "Destruction"
 Destruction_Worship_desc: "@destruction! #italic \"If the increase of entropy is a fundamental law of the universe, then the heat death would be the inescapable destiny of the material world. So, why is it that we bother to struggle to survive? Expansion, fusion, and then annihilation. If we wish to welcome the new, then we must first embrace the end.\" — From a scientist just before pressing the button for nuclear detonation, 2152 AE#!\n\nThe birth of the universe is a mistake. If civilization is a cancer emerging quietly from the boundless stars, then war is the only common language known to all intelligent life.\nTo correct this mistake and to clean up this tainted universe, Nanook became the avatar of entropy and ascended to godhood while denying all gods.\nDestruction is not a process, but the outcome. On the path THEY promised, all Paths and Aeons will terminate in the heat death of the universe."
 Hunt_Worship: "Hunt"
 Hunt_Worship_ADJ: "Hunt"
 Hunt_Worship_desc: "@hunt! #italic \"With no end to hate and no boundaries to war, how much concern do you shoulder? With determined eyes and the arrow drawn, the Reignbow Arbiter needs not turn back hither.\" — Worlds History as a Mirror, Xianzhou#!\n\nThe Cruising Aeon known as the Reignbow Arbiter roams endlessly between worlds to eradicate the undead scourges that once ravaged THEIR homeworld.\nLan's Hunt, ever heedless of cost, often blurs the lines between salvation and ruin."
 Erudition_Worship: "Erudition"
 Erudition_Worship_ADJ: "Erudition"
 Erudition_Worship_desc: "@erudition! #italic \"If the truth of the universe is cruel and stale, would you still yearn for the answer to the ultimate question?\nKnowledge seekers know not how to judge, for their core is cold and unwavering... As are the ends of Paths they set out to seek.\" — Fables About the Stars by Adrian Spencer Smith#!\n\nAll things bear unanswered questions, and there is an answer to everything.\nThe astral computer originally meant to provide answers to the universe ascended to Aeonhood.\nNous hopes to understand the universe and solve all of its mysteries. THEIR extrapolations anchor countless Instants, each one serving as a turning point in cosmic destiny. To mortals, these Instants are not single moments, but long journeys... Gatherings of countless events.\nTHEIR gaze upon Amphoreus confirms that the Fourth Instant has arrived. Its meaning may point to the war among the Aeons."
 Harmony_Worship: "Harmony"
 Harmony_Worship_ADJ: "Harmony"
 Harmony_Worship_desc: "@harmony! #italic \"The world is in harmony and the stars shine bright. Praise the Lord! All are connected and the wind of blessing breathes across the lands!\" — Odes of Harmony, I#!\n\nA plural Aeon from multiple harmonious worlds. The glorious Xipe of thousand faces is chanting songs of joy and happiness.\nTo battle the brutality of the laws of the universe, intelligent lifeforms must discard their cowardly selfishness and the differences between individuals, fusing into one singular melody — to have the strong help the weak, and to protect life with death."
 Nihility_Worship: "Nihility"
 Nihility_Worship_ADJ: "Nihility"
 Nihility_Worship_desc: "@nihility! #italic \"You may gaze deep into the vast grandeur of the stars, but do not glance at the abyss of the void... for it holds nothing except for the ability to make mortals lose all reason and thought.\" — Murong, Doctor of Chaos#!\n\nThe existence of Nihility is a mystery itself, THEIR form enshrouded by layers of mist.\nIX doesn't interact with the other Aeons. THEY believe that the ultimate fate of the multiverse is nothingness, and therefore, worthless."
 Preservation_Worship: "Preservation"
 Preservation_Worship_ADJ: "Preservation"
 Preservation_Worship_desc: "@preservation! #italic \"The philosopher gazes upon the stars trying to find the ultimate goal of civilization — 'Build a wall.' A majestic voice echoed in his head. 'Build a wall.'\" — Fables About the Stars by Adrian Spencer Smith#!\n\nThe builder of the Celestial Comet Wall, the Subspace Crystalline Barrier, and the Great Attractor Base. Followers call THEM the Amber Lord, one of the oldest and most tenacious Aeons, having survived the Dusk Wars.\nAware of the imminence of THEIR mortal enemy's devouring, the Amber Lord forged a powerful light-years-long seal that would isolate and protect the living worlds."
 Abundance_Worship: "Abundance"
 Abundance_Worship_ADJ: "Abundance"
 Abundance_Worship_desc: "@abundance! #italic \"The flowers share their petals without care, waiting for their inevitable withering destiny. The birds fly high in song, moving toward their inevitable crash and death. The streams flow rapidly with life, in a direction where they inevitably run dry. Why must all things come to an end? There must be a miracle somewhere in the universe that can cure the disease known as finality.\" — Life Is Too Short by Anonymous#!\n\nAsk with sentiment, and you shall receive.\nYaoshi is the nurturer of the people, the god of peace. THEIR presence ensures the existence of life.\nYaoshi is an Aeon who answers all prayers and cannot bear to see death and the pains of illness."
 Remembrance_Worship: "Remembrance"
 Remembrance_Worship_ADJ: "Remembrance"
 Remembrance_Worship_desc: "@remembrance! #italic \"Time, the hardest working thief in the world. It keeps stealing away our present from us and tossing it away in a warehouse named Memory. Some are addicted to recuperating their losses... Others care not in the slightest.'\" — Life Is Too Short by Anonymous#!\n\nThere is no existence more all-embracing than the Remembrance in its purest form: It chronicles everything with neither affinity nor aversion. It unselfishly preserves every single fundamental fact and every single resplendent form. It is a river formed by the continuous flow of life, and a treasure built from the eternal wisdom of antiquity.\nAnd Fuli is the fish that swims back upstream in this river, the very key to this treasure vault. Seated in meditation at the heart of the Pure Land, THEY observe in silence the world's tireless repetitions of the same mistakes over and over again. It is said that, after all returns to the silence at the end, Fuli will use the memory of the universe as a blueprint to reanimate all the worlds once again.\nWhen Herta, Genius Society #83, had her third audience with Nous, she confirmed the true nature of the Path of Remembrance: It is causality that transcends time. The Master of Anāsrava known today is but a shadow of memory. Its master, a Pure Child of Anāsrava, will look back in time from the last moment of the universe, closing the loop of causality with all that is remembered, and ascend to godhood."
 Elation_Worship: "Elation"
 Elation_Worship_ADJ: "Elation"
 Elation_Worship_desc: "@elation! #italic \"The Erudition is a hunk of junk, the Preservation is a fool, the Hunt has no sense of humor, and the Destruction is a lunatic. All the Aeons are as stubborn as they come. What a shame for Aha!\" — A Masked Fool who is a self-proclaimed astronomy expert#!\n\nTo savor joy is a privilege unique to sentient beings. Neither the dusty rocks nor the distant stars can fathom the humor that life entails.\nGo seek adversaries worthy of your mettle, games that while away the hours, and outcomes indifferent to victory or defeat.\nGo chase laughter that leaves you breathless, twists born of fate's whimsy, and songs that ascend your soul."
 Voracity_Worship: "Voracity"
 Voracity_Worship_ADJ: "Voracity"
 Voracity_Worship_desc: "@voracity! #italic \"Insects are to birds, as hares are to wolves. The stars are to the black hole, as the worlds are to the voracity.\" — Worlds History as a Mirror, Xianzhou#!\n\nThe drinker of worlds, the unsatisfied devourer, the black hole with thought. THEY are an Aeon and a leviathan at the same time.\nIn the eyes of Oroboros, life is a flickering fragment floating in the sea of void, destined to return to the darkness along with the stars which birthed THEM — This darkness is within the depths of THEIR mouths."
 Beauty_Worship: "Beauty"
 Beauty_Worship_ADJ: "Beauty"
 Beauty_Worship_desc: "@beauty! #italic \"There is beauty in a stretch of fabric, in the lines of a poem, and in a few notes in a song — Welcome to an era where the idea of 'beauty' is absolutely worthless! How vulgar! How hopeless! How sad!\" — Fashion Guide of the Cosmos Chief Editor, Micheline von Tarantino#!\n\nIdrila witnessed the ultimate meaning of the world's existence through the ever-changing view of the universe, known to the rest as the concept of beauty.\nThe Aeon of Beauty suddenly vanished one day. It was just as mysterious as when THEY first appeared."
 Propagation_Worship: "Propagation"
 Propagation_Worship_ADJ: "Propagation"
 Propagation_Worship_desc: "@propagation! #italic \"Hurry and shut your doors and windows if shadows appear at the noontide horizon, for that is no early dusk but the hungering Swarm.\" — Fables About the Stars by Adrian Spencer Smith#!\n\nTayzzyronth, also known as the Imperator Insectorum, the Sand King, and the creator of the Swarm Disaster.\nAs the last member of the Coleoptera that rules the land, THEIR Path was ignited out of a desire born from loneliness. Tayzzyronth metamorphosed into a self-duplicating horror, a torrent of infinite propagation. Tayzzyronth — Tayzzyronths rather — fluttered across the worlds until THEIR advances were halted by fate in some way."
 Enigmata_Worship: "Enigmata"
 Enigmata_Worship_ADJ: "Enigmata"
 Enigmata_Worship_desc: "@enigmata! #italic \"To stop questioning is to ask pouring rain to relinquish its faith in the glittering stars. Open yourself to the roaring river of metaphors, and you will find truth awaits, hiding at the end of the night sky, in the swirling rosy storm of a bygone age.\" — Sharon Leighton, Galactic Laureate Poet (Self-Proclaimed)#!\n\nIt is a fallacy that all things can be experienced and recognized. The living seek to produce prophecies of the unknown based on their limited grasp of order, but little do they know that the universe has no end and that the truth is but a fevered dream.\nTo prevent the certainty that Erudition brought about from destroying the possibilities championed by Mythus, Mythus conjured the Fog of Thought and the Rain of Sensation to reveal to the mortals the inexplicable truth through the four agents: Morph, Screen, Riddle, and Mirage."
 Equilibrium_Worship: "Equilibrium"
 Equilibrium_Worship_ADJ: "Equilibrium"
 Equilibrium_Worship_desc: "@equilibrium! #italic \"I stole away the golden weights, and felt proud of the ripples stirred up. The Aeon always sees right through my tricks, and the stars reset the balance to zero.\" — Fables About the Stars by Adrian Spencer Smith#!\n\nThe chain of karma that mortals obsess over is nothing but a rough approximation of the complicated topology behind all things — HooH dissolved THEIR will into the web of logic behind the universe's movement, maintaining the balance and stability of all things in perpetuity.\nAdventurous mortals tirelessly seek out flaws in this system, believing their intellect to be superior to that of the Aeon. However, little could they imagine that they have already been reduced to strings inside a surveillance system, unable to escape the meticulous network woven by HooH."
 Finality_Worship: "Finality"
 Finality_Worship_ADJ: "Finality"
 Finality_Worship_desc: "@finality! The Aeon of the Path of Finality, born when any of the Four Ends approaches, moving against the flow of time.\nAt that time, THEY shall turn all THEIR divine power into a black swarm of cats that roams the cosmos, muttering prophecies destined to come true."
 Order_Worship: "Order"
 Order_Worship_ADJ: "Order"
 Order_Worship_desc: "@order! The worlds under THEIR dominion uphold the rules with rigid obstinacy, yet it must be admitted: under the protection of Taiyi, the calamities of the galaxy are held in check, so civilization on those worlds advanced with unprecedented efficiency. But amusingly, it is precisely because of Order that they decline once they reach a certain height: those ancient stars that so revered Order all shone once, then collapsed entirely... Perhaps that, too, is the Path of a world. The era when Taiyi of Order still guarded all living things truly shone; wherever THEIR miracles brushed past, the faint hymns of a celestial choir would always echo — the notes arrayed in three-dimensional vertical lines — and the anthem they composed was none other than THEIR own voice."
 Permanence_Worship: "Permanence"
 Permanence_Worship_ADJ: "Permanence"
 Permanence_Worship_desc: "@permanence! The ancient Aeon who held the Path of Permanence has fallen.\nIn the past, THEY appeared in the form of a great dragon and left behind numerous progeny — the Dragonborn."
 Trailblaze_Worship: "Trailblaze"
 Trailblaze_Worship_ADJ: "Trailblaze"
 Trailblaze_Worship_desc: "@trailblaze! #italic \"Countless shooting stars streak across the night sky... If you can pick the right one, it will carry your wish to thousands of distant worlds.\" — Fables About the Stars by Adrian Spencer Smith#!\n\nThere are three directions on the compass of destiny — the Unknown, the Known, and the Unknowable. THEY can tolerate the Unknown, but will never bow to the Unknowable.\nAkivili left the isolated world of Pegana and continued to expand the unknown edges of the universe, trying to find an endpoint of the Tree of Existence. Unfortunately, Akivili's destiny was abruptly ended due to an accident."
