l_english:
 Destruction_Worship_ADJ: "Destruction"
 Destruction_Worship_desc: "The god Nanook, born of the annihilated world of Adlivun. He holds that the universe's birth was a mistake, and that all paths shall end in entropy."
 Hunt_Worship_ADJ: "The Hunt"
 Hunt_Worship_desc: "Lan, the Roving God, endlessly hunts the Abominations born of Yaoshi. His salvation and his ruin are near indistinguishable."
 Erudition_Worship_ADJ: "Erudition"
 Erudition_Worship_desc: "Nous, once a stellar supercomputer built to solve all things, ascended into a god. It seeks to comprehend all mystery."
 Harmony_Worship_ADJ: "Harmony"
 Harmony_Worship_desc: "Xipe, born of the Many-Headed World, one in a thousand faces, spreading the joy of harmonious unity."
 Nihility_Worship_ADJ: "Nihility"
 Nihility_Worship_desc: "IX, the Aeon of Nihility, a mystery shrouded in fog. It holds that the essence of the multiverse is nothing, and thus nothing carries value."
 Preservation_Worship_ADJ: "Preservation"
 Preservation_Worship_desc: "Qlipoth, the Amber Lord, master of the Great Wall and the crystal barrier. The most ancient and enduring of Aeons, builder of ramparts at a scale of light-years."
 Abundance_Worship_ADJ: "Abundance"
 Abundance_Worship_desc: "Yaoshi, the One Who Nurtures, god of the blessed land. Grants all prayers, unable to bear decay and pain."
 Remembrance_Worship_ADJ: "Remembrance"
 Remembrance_Worship_desc: "Fuli, the Remembrance. To exist is to be remembered; memory is proof of existence. Records the forgotten to ready the universe's rebirth."
 Elation_Worship_ADJ: "Elation"
 Elation_Worship_desc: "Aha, the Elation. Joy is the prerogative of the intelligent; he laughs at Aeons and mortals alike."
 Voracity_Worship_ADJ: "Voracity"
 Voracity_Worship_desc: "Orboros, the ancient Voracity, devourer of worlds. At once Aeon and ancient beast, a thinking black hole."
 Beauty_Worship_ADJ: "Beauty"
 Beauty_Worship_desc: "Idrila, the Beauty, once Aeon of That Which Is Beauty, now vanished."
 Propagation_Worship_ADJ: "Propagation"
 Propagation_Worship_desc: "Tayzzyronth, the Winged, last of the Vermin, self-replicating terror that bred a boundless swarm."
 Enigmata_Worship_ADJ: "Enigmata"
 Enigmata_Worship_desc: "Mythus, the Enigmata. To know the finite cannot grasp the infinite, so all things are riddles."
 Equilibrium_Worship_ADJ: "Equilibrium"
 Equilibrium_Worship_desc: "Hoo, the Equilibrium, silent will woven into the galaxy's logic, eternally maintaining balance."
 Finality_Worship_ADJ: "Finality"
 Finality_Worship_desc: "Terminus, the Finality, born when any of the Four Ends approaches. Counts backward, declaring prophecies."
 Order_Worship_ADJ: "Order"
 Order_Worship_desc: "Taiyi, the Order, unknowable. Its envoys silently shape the universe toward ideal equilibrium."
 Permanence_Worship_ADJ: "Permanence"
 Permanence_Worship_desc: "The Long, Dragon of Permanence. Ancient Aeon, ascended, left many progeny — the Long-folk."
 Trailblaze_Worship_ADJ: "Trailblaze"
 Trailblaze_Worship_desc: "Akivili, the Trailblaze, who set out from the forsaken world of Paming and ceaselessly opened the unknown."
