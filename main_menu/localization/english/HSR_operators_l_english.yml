 desc_HSR_belong_XianzhouZhuming_trait: "A character hailing from The Xianzhou Zhuming."
 desc_HSR_blackswan_01_trait: "开拓者？有趣的名字，唔，还有难以看穿的命运。"
 desc_HSR_blackswan_01_trait_leader: "命运，并非一种选择。"
 desc_HSR_blade_01_trait: "开拓者…我不认识你。这对你而言，是件好事。"
 desc_HSR_blade_01_trait_leader: "以掌中之剑，送你一程。"
 desc_HSR_boothill_01_trait: "我叫波提欧。听说过我的人都知道我是干什么的，没听说过我的人…为你的小命着想，最好永远也别听说。"
 desc_HSR_boothill_01_trait_leader: "排队来吃枪子儿啦？"
 desc_HSR_bronya_01_trait: "我是贝洛伯格「大守护者」继承人，代行银鬃铁卫统领，布洛妮娅•兰德…方才只是例行的自我介绍，叫我布洛妮娅就好。"
 desc_HSR_bronya_01_trait_leader: "这一战，不可避免。"
 desc_HSR_castorice_01_trait: "欢迎来到奥赫玛，我是遐蝶。抱歉，与他人保持一定距离是我的习惯…如果阁下愿意，我自然可以站近些。"
 desc_HSR_castorice_01_trait_leader: "生命并非如蝶翼般易折。"
 desc_HSR_cerydra_01_trait: "「燃冕者」、「独裁官」、「女皇」、「总帅」、「凯撒」…世人给予我的头衔林林总总，但你不妨直呼我的本名——刻律德菈。"
 desc_HSR_cerydra_01_trait_leader: "若世界总是非黑即白，也略感无趣。"
 desc_HSR_cipher_01_trait: "赛法利娅？你认识我啊…不过，现在很少有人提起这个名字了。你叫我赛飞儿吧，听起来就比风还快，侠盗得很，对吧？"
 desc_HSR_cipher_01_trait_leader: "打个商量，躺平一点，我好早点收工~"
 desc_HSR_clara_01_trait: "克拉拉：你好…我是克拉拉，可以成为我的家人么…就像史瓦罗先生一样。史瓦罗：有我在，开拓者就是你的家人。"
 desc_HSR_clara_01_trait_leader: "克拉拉：克拉拉要勇敢一点…"
 desc_HSR_cyrene_01_trait: "这是命运的邂逅吗，还是…久别重逢呢？真让人心跳加速呀，那…就像初遇时那样，再一次呼唤我「昔涟」，好吗？"
 desc_HSR_cyrene_01_trait_leader: "嘻，到人家表现啦♪"
 desc_HSR_dahlia_01_trait: "你的记忆…还真是棘手呢，那不妨从我敞开心胸开始——我的名字是康士坦丝，那些跪倒于我裙摆下的人称我为「大丽花」。别怕，随我来吧，在这场只属于你我的双人舞中，你会知道，过去如何被焚烧，未来又如何被埋葬……"
 desc_HSR_dahlia_01_trait_leader: "亲爱的，还有什么遗言吗？"
 desc_HSR_danheng_01_trait: "重新介绍一下自己，我叫丹恒，担任列车的护卫，列车的智库也由我维护。"
 desc_HSR_danheng_01_trait_leader: "争斗…并无意义。"
 desc_HSR_danhengil_01_trait: "这是我原本的样子，持明族的姿态…不必担心，我仍是丹恒，是持明后裔，也是一名无名客。"
 desc_HSR_danhengil_01_trait_leader: "我能感受到这股躁动…"
 desc_HSR_danhengpt_01_trait: "如你所见，那是「不朽」的力量造就的蜕变。你也许有许多疑问，不过在解释之前，我想再次介绍一下自己——我是星穹列车的护卫，你的伙伴，「无名客」丹恒。"
 desc_HSR_danhengpt_01_trait_leader: "这股力量，已不同过往。"
 desc_HSR_drratio_01_trait: "我是维里塔斯•拉帝奥，博识学会的学者和老师，也是一介庸人。如果有一天，你的脑袋出现了「愚钝」的症状，届时请称呼我为——「真理医生」。"
 desc_HSR_drratio_01_trait_leader: "由我提问了。"
 desc_HSR_evanescia_01_trait: "恭喜你发现宝藏！我就是绯英，你好啊，大主角小浣熊。往常在这场狂欢里，我只会确保幻月游戏顺利召开，但这一次，如果是同你一起上台表演，也未尝不可呀！"
 desc_HSR_evanescia_01_trait_leader: "让我量量，犯规程度…超标了！"
 desc_HSR_evernight_01_trait: "翁法罗斯的三月，是属于永夜之帷的时间…就请以「长夜月」这个称呼，将我放进你的回忆中吧。若能躲进岁月的罅隙，属于我们的时间还有很多，很多♭"
 desc_HSR_evernight_01_trait_leader: "好啦，不要再胡闹啦。"
 desc_HSR_feixiao_01_trait: "我是飞霄，仙舟「曜青」的将军。这样就算认识了，如果星穹列车碰上什么麻烦，尽管联系，曜青随叫随到。"
 desc_HSR_feixiao_01_trait_leader: "比划比划，给你五秒。"
 desc_HSR_fugue_01_trait: "虽是初次相会，小女子却有种久别重逢的感受。前尘隔海，旧我不再，还请允许小女子暂且自称「忘归人」。"
 desc_HSR_fugue_01_trait_leader: "不知我们是否打过照面？"
 desc_HSR_fuxuan_01_trait: "本座乃罗浮太卜司之首，符玄。初次见面——不，该说久见了…我已在法眼中遍历了与你之间的二十二次初会场面。"
 desc_HSR_fuxuan_01_trait_leader: "以额间之眼观之…"
 desc_HSR_gallagher_01_trait: "我是加拉赫，这儿的「猎犬」之一。欢迎来到梦想之地「匹诺康尼」，新手无名客。"
 desc_HSR_gallagher_01_trait_leader: "怎么？又想被揍了？"
 desc_HSR_gepard_01_trait: "我是贝洛伯格的银鬃铁卫戍卫官，杰帕德•朗道。如果你在城中发现任何异常，都可向我报告。"
 desc_HSR_gepard_01_trait_leader: "做好觉悟吧。"
 desc_HSR_gilgamesh_01_trait: "星核，我的财宝。等你行至终点，本王就将你封入宝库深处，最安全的位置吧…哼，话虽如此，你的「开拓」还将继续许久，甚至超出了本王远见的终极啊。"
 desc_HSR_gilgamesh_01_trait_leader: "这也能称作战斗吗？"
 desc_HSR_guinaifen_01_trait: "我叫桂乃芬！桂为嘉木，乃者「是」也，芬即芳香，是不是好听又好记？我平时在长乐天这边撂地杂耍，有空记得来看表演哦～"
 desc_HSR_guinaifen_01_trait_leader: "有钱的捧个钱场。"
 desc_HSR_hanya_01_trait: "小女子乃是十王敕使「寒鸦」，列名拘、锁、刑、问四位判官之末。多得十王赏识，能执掌天笔，录罪判罚。"
 desc_HSR_hanya_01_trait_leader: "你没意识到事态严重……"
 desc_HSR_herta_01_trait: "我是黑塔，现在很忙，这是远程人偶自动应答模式：你好，你好，大家好，祝你拥有愉快的一天，再见。"
 desc_HSR_herta_01_trait_leader: "看什么看？"
 desc_HSR_himeko_01_trait: "欢迎上车，开拓者，我是星穹列车的领航员，姬子。相信我们将会共度一段有趣的旅程。"
 desc_HSR_himeko_01_trait_leader: "战斗是一场精密的设计。"
 desc_HSR_himekonova_01_trait: "开拓者，无论拥有怎样复杂的过去，无论去往多么遥远的未来，我们之间的关系也不会改变。我是星穹列车的领航员，姬子，永远与你眺望同一风景的家人。"
 desc_HSR_himekonova_01_trait_leader: "该重新认识下无名客了。"
 desc_HSR_hook_01_trait: "下层区的大人归地火管，小孩归鼹鼠党管，而我就是鼹鼠党的老大，你可以称呼我为——漆黑的虎克大人！"
 desc_HSR_hook_01_trait_leader: "哈！虎克来捣蛋！"
 desc_HSR_huohuo_01_trait: "藿藿：你、你好…我叫藿藿，是新上任的十王司判官，那个，还要说什么来着…尾巴：小丫头，我呢？本大爷可是岁阳一族赫赫有名的……藿藿：尾巴！他是尾巴！"
 desc_HSR_huohuo_01_trait_leader: "藿藿：非、非得战斗吗？尾巴：对喽~别逃啊~"
 desc_HSR_hyacine_01_trait: "身为天空的后裔，雅辛忒丝会与各位一同完成逐火的使命。同时，作为昏光庭院的医师风堇，我也会尽力为大家提供援助。这是我的好助手、好伙伴——天马小伊卡，想揉一揉吗？请放心大胆地来，它很喜欢~"
 desc_HSR_hyacine_01_trait_leader: "未来，一定是光明的。"
 desc_HSR_hysilens_01_trait: "海列屈拉？那个名字早已随往日沉入了深海…原来是你，灰色的小鱼苗…还是叫我海瑟音吧。作为圣城的骑士统领，我会驻守于此，绝不允许命运的乱流扰乱你的视线。"
 desc_HSR_hysilens_01_trait_leader: "小心被那无声的浪花划开咽喉。"
 desc_HSR_jade_01_trait: "你好呀，我叫「翡翠」，应你的欲求而来。若想典贷，须先抵押同等重要之物…尊严、情感、乃至生命。你愿意用什么来和我做交换呢？"
 desc_HSR_jade_01_trait_leader: "典贷嘛，有舍有得是自然。"
 desc_HSR_jiaoqiu_01_trait: "初次见面！不才椒丘，现为曜青「天击将军」飞霄帐下的随军医士，也算半个幕僚。如何称呼？不如就叫我「椒椒」吧——正所谓「铁中铮铮，佣中佼佼」，寓意还不错，对吧？"
 desc_HSR_jiaoqiu_01_trait_leader: "后发制人，也是出奇制胜。"
 desc_HSR_jingliu_01_trait: "镜流不过是一介仙舟弃卒，流浪剑士。若不想惹来麻烦，装作我们未曾谋面亦可。"
 desc_HSR_jingliu_01_trait_leader: "无趣。"
 desc_HSR_jingyuan_01_trait: "我是「罗浮」云骑将军景元。不必拘谨，「将军」只是一时的身份，你称呼我景元便可。"
 desc_HSR_jingyuan_01_trait_leader: "随我冲阵。"
 desc_HSR_kafka_01_trait: "嗨，列车团…嗯，你们逮住我啦。"
 desc_HSR_kafka_01_trait_leader: "索性都干掉吧~"
 desc_HSR_lingsha_01_trait: "初次面，妾身名唤灵砂，自朱明学成归来，忝任罗浮丹鼎司司鼎。若您身体不适，我可以随时为您安排医士。"
 desc_HSR_lingsha_01_trait_leader: "腥膻恶臭快些散去如何？"
 desc_HSR_luka_01_trait: "哟，你好！我叫卢卡，是「地火」的成员。打击恶棍，守护镇民——这就是我每天的工作。"
 desc_HSR_luka_01_trait_leader: "对付你，一拳就够了！"
 desc_HSR_luocha_01_trait: "在下是路经此处的行商，叫我「罗刹」便可。"
 desc_HSR_luocha_01_trait_leader: "可惜，你们选错了对手。"
 desc_HSR_lynx_01_trait: "…我是玲可，贝洛伯格雪原科考队员。工作的事情麻烦工作期间找我，其他时间…我都不在。嗯，就这样，再见。"
 desc_HSR_lynx_01_trait_leader: "开始本次科考记录。"
 desc_HSR_mar7th2_01_trait: "你好，开拓者。欢迎入职星穹列车，我是三月七，星穹列车的乘员，也是你的同事。现在，请先拍摄入职照…瞧把你吓的，咱是在开玩笑啦~"
 desc_HSR_mar7th2_01_trait_leader: "碰上我算你们运气不好。"
