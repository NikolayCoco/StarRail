 desc_HSR_acheron_01_trait: "\"Acheron...\" Merely a borrowed name. You know my nature, remember my deeds... Thus, I am Acheron."
 desc_HSR_acheron_01_trait_leader: "Did you come here of your own volition, or was it fate?"
 desc_HSR_aglaea_01_trait: "O, noble guest from afar. The wind brought me news of you along the golden threads. My name is Aglaea, the Dressmaster of Okhema and one of Amphoreus' Chrysos Heirs. I hope we treat each other with honesty."
 desc_HSR_aglaea_01_trait_leader: "Is that fear I sense? Your breathing is erratic."
 desc_HSR_anaxa_01_trait: "My name is Anaxagoras, one of the Seven Sages of the Grove of Epiphany, founder of the Nousporists. Now, don't make me repeat the following again. Rule number one: Do not call me Anaxa. Rule number two: Never interrupt me — silence is golden. Remember that."
 desc_HSR_anaxa_01_trait_leader: "What's the matter?"
 desc_HSR_archer_01_trait: "First meeting, huh? Just call me Archer. Lucky for us, we're not here to kill each other, so let's keep things civil, if we can."
 desc_HSR_archer_01_trait_leader: "My turn? So much work."
 desc_HSR_argenti_01_trait: "My name is Argenti, I belong to the Knights of Beauty. May this rose convey my heartfelt salutations."
 desc_HSR_argenti_01_trait_leader: "My oath is to a solitary rose."
 desc_HSR_arlan_01_trait: "Hello, Trailblazer. I'm Arlan, I head up the Security Department on Herta Space Station. I'll be in charge of your safety during your time here."
 desc_HSR_arlan_01_trait_leader: "Fight to win."
 desc_HSR_ashveil_01_trait: "I am Detective Ashveil of the Ashen Detective Agency. This is my business card. I take all sorts of assignments such as looking for lost pets, pretending to be a parent in parent-teacher nights, capturing interstellar wanted criminals, or tracing the whereabouts of an Aeon... So, what can I do for you?"
 desc_HSR_ashveil_01_trait_leader: "My gut says you're shady."
 desc_HSR_asta_01_trait: "Hi, Trailblazer! The name's Asta, I'm the lead researcher on Herta Space Station. I'll be sure to let you know if I need your help... Don't worry, I think you'll be hearing from me."
 desc_HSR_asta_01_trait_leader: "A guest with no manners, huh?"
 desc_HSR_aventurine_01_trait: "Your humble servant \"Aventurine,\" at your disposal. Just a cog in the machine known as the IPC's Strategic Investment Department. Nevertheless, I can also play the role of \"friend\" — if needed."
 desc_HSR_aventurine_01_trait_leader: "Better hedge your bets."
 desc_HSR_aventurinewaveflair_01_trait: "Friend, we meet again! I just wrapped up a sponsored shoot, and wow, keeping a smile plastered on my face for the camera is no easy feat. But now that I've been promoted to P 46 , I can finally go on vacation. Want to relax and enjoy your time with me? I guarantee you'll have an unforgettable getaway."
 desc_HSR_aventurinewaveflair_01_trait_leader: "The undercurrents are surging... Time to make an appearance."
 desc_HSR_bailu_01_trait: "I'm Bailu, a doctor from the Alchemy Commission. Come here and let me have a look at you. Hmm... What's wrong? Where does it hurt?"
 desc_HSR_bailu_01_trait_leader: "Looks like somebody needs a doctor!"
 desc_HSR_blackswan_01_trait: "Trailblazer? Intriguing name. Hmm... and a fate that's quite elusive..."
 desc_HSR_blackswan_01_trait_leader: "The threads of destiny aren't chosen."
 desc_HSR_blade_01_trait: "Trailblazer... I don't know you. Consider that a good thing."
 desc_HSR_blade_01_trait_leader: "I will dispatch you by my sword."
 desc_HSR_boothill_01_trait: "Name's Boothill. Those who've heard of me know what I'm about. Those who haven't... well, for the sake of your own skin, you best keep it that way."
 desc_HSR_boothill_01_trait_leader: "Waiting in line for a bullet?"
 desc_HSR_bronya_01_trait: "My name is Bronya Rand, heir to Belobog's supreme guardian and acting commander of the Silvermane... Apologies, I'm used to introducing myself like that — you can call me Bronya."
 desc_HSR_bronya_01_trait_leader: "This battle is unavoidable."
 desc_HSR_castorice_01_trait: "Welcome to Okhema. I am Castorice. Apologies, it is my habit to keep my distance from others... I can get closer if you wish, however."
 desc_HSR_castorice_01_trait_leader: "Life is not as fragile as butterfly wings."
 desc_HSR_cerydra_01_trait: "\"Flamecrowned,\" \"Tyrant,\" \"Empress,\" \"Supreme Commander,\" \"Imperator\"... The world has given me countless titles, but you may simply call me by my true name — Cerydra."
 desc_HSR_cerydra_01_trait_leader: "If the world was all black or white, it would lose its charm."
 desc_HSR_cipher_01_trait: "Cifera? Ah, so you've heard of me... But few call me by that name these days. Call me Cipher. It's sharper and swifter, like the wind itself. A perfect name for a master thief, don't you think?"
 desc_HSR_cipher_01_trait_leader: "Here's the deal. Don't fight too hard, so I can go home early~"
 desc_HSR_clara_01_trait: "Clara: Hello... I'm Clara. Wanna be in my family? ...Like Mr. Svarog? Svarog: As long as I'm here, Trailblazer is your family."
 desc_HSR_clara_01_trait_leader: "Clara: I need to be brave..."
 desc_HSR_cyrene_01_trait: "Is this a meeting ordained by fate, or... a long-overdue reunion? It's making my heart beat faster. Then... please once again call me \"Cyrene,\" just like when we met the first time, okay?"
 desc_HSR_cyrene_01_trait_leader: "Hehe, it's my turn to shine ♪"
 desc_HSR_dahlia_01_trait: "Your memories... are quite thorny. So, why don't we start with me laying my thoughts bare...? My name is Constance, and those who have fallen to my charms call me \"The Dahlia.\" Don't be afraid. Come with me. In this duet belonging only to the two of us, you will learn how the past is being cremated and how the future is being buried..."
 desc_HSR_dahlia_01_trait_leader: "Any last words, sweetheart?"
 desc_HSR_danheng_01_trait: "I should reintroduce myself. My name is Dan Heng — I'm the guard on the Express. I also administer the train's data bank."
 desc_HSR_danheng_01_trait_leader: "Fighting... is meaningless."
 desc_HSR_danhengil_01_trait: "This is my original appearance, that of the Vidyadhara... Don't worry, I'm still Dan Heng, a descendant of the Vidyadhara, and also a member of the Nameless."
 desc_HSR_danhengil_01_trait_leader: "I sense a storm..."
 desc_HSR_danhengpt_01_trait: "As you can see, that transformation was brought about by the power of the Permanence. Though you may have many questions, I'd like to reintroduce myself before I answer them. I am the Guard of the Astral Express, your companion, Dan Heng the Nameless."
 desc_HSR_danhengpt_01_trait_leader: "My strength is not what it was... it's more."
 desc_HSR_drratio_01_trait: "I am Dr. Ratio, a scholar and teacher of the Intelligentsia Guild, and one of the mediocres. If one day your brain shows symptoms of dullness, then please give the doctor a call."
 desc_HSR_drratio_01_trait_leader: "I'm asking the questions."
 desc_HSR_evanescia_01_trait: "Congrats, you've hit the jackpot! I'm Evanescia. Nice to meet you, Main Character Little Raccoon. Usually, amidst all this revelry, I just make sure the Phantasmoon Games run smoothly... But this time? Sharing the stage with you doesn't sound half bad!"
 desc_HSR_evanescia_01_trait_leader: "Let me measure that... Whoa, you're WAY over the limit!"
 desc_HSR_evernight_01_trait: "The third month of Amphoreus is the month reserved for the Veil of Evernight... So, please place me into your memory using the name \"Evernight.\" If we can hide in the cracks of time, then we'll still have countless moments that belong to us ♭."
 desc_HSR_evernight_01_trait_leader: "Come on. Stop messing around."
 desc_HSR_feixiao_01_trait: "I'm Feixiao, general of the Xianzhou Yaoqing. Now that we're acquainted, should the Astral Express run into any trouble, feel free to contact me. The Yaoqing will be there in an instant."
 desc_HSR_feixiao_01_trait_leader: "Show me what you can do. I'll give you five seconds."
 desc_HSR_fugue_01_trait: "Though it's our first meeting, it feels as if we're reuniting after a long separation. The past is behind us, and the old me is no more. Please allow me to temporarily call myself \"Fugue.\""
 desc_HSR_fugue_01_trait_leader: "Have we met before?"
 desc_HSR_fuxuan_01_trait: "I am Fu Xuan, head of the Divination Commission. This is our first encounter... or perhaps I should say — our twenty-second first encounter... Through the omniscia, I have met you for the first time, many times..."
 desc_HSR_fuxuan_01_trait_leader: "The omniscia sees through you..."
 desc_HSR_gallagher_01_trait: "Gallagher's the name, I'm one of the local \"Hounds\" around here. Step into Penacony, the Land of Dreams, Nameless one."
 desc_HSR_gallagher_01_trait_leader: "So? In the mood for another beating?"
 desc_HSR_gepard_01_trait: "My name is Gepard Landau, I'm a captain of the Silvermane Guards. If you discover anything suspicious in the city, you can always report it to me."
 desc_HSR_gepard_01_trait_leader: "I hope you're prepared."
 desc_HSR_gilgamesh_01_trait: "Stellaron, my treasure. When you reach the end of your journey, I shall seal you within the deepest depths of my treasury, in the safest place of all... Hmph. That said, your Trailblaze shall endure for a long time yet, reaching even beyond the ultimate horizon of my own foresight."
 desc_HSR_gilgamesh_01_trait_leader: "You dare call this a \"battle\"?"
 desc_HSR_guinaifen_01_trait: "My name is Guinaifen! \"Gui\" means wood, \"Nai\" means to exist, and \"Fen\" means fragrant — rolls right off the tongue, doesn't it? I usually do juggling performances on this side of Exalting Sanctum. Remember to come see the show when you have the chance~"
 desc_HSR_guinaifen_01_trait_leader: "Turn out your pockets!"
 desc_HSR_hanya_01_trait: "I am Hanya, envoy of the Ten Lords. Out of the four duties of a judge — detention, interrogation, incarceration, and punishment — I am in charge of interrogation. Held in high esteem by the Ten Lords, I am the wielder of the Oracle Brush, recording crimes and punishments."
 desc_HSR_hanya_01_trait_leader: "You don't know how serious this is..."
 desc_HSR_herta_01_trait: "This is Herta. I'm busy right now. This is my ranged puppet's automated-response mode: Hello everyone. Hope you have a wonderful day. Goodbye."
 desc_HSR_herta_01_trait_leader: "What are you looking at?"
 desc_HSR_himeko_01_trait: "Welcome aboard, Trailblazer. I'm Himeko, navigator of the Astral Express. I'm sure we're about to embark on a fascinating journey together."
 desc_HSR_himeko_01_trait_leader: "Combat is a series of precise machinations."
 desc_HSR_himekonova_01_trait: "Trailblazer, no matter how tangled our pasts or how distant the future, our bond remains unchanged. I am Himeko, Navigator of the Astral Express... and your family, always looking out at the same horizon as you."
 desc_HSR_himekonova_01_trait_leader: "You're about to relearn who the Nameless truly are."
 desc_HSR_hook_01_trait: "Haha, the grown-ups in the Underworld listen to Wildfire and the kids listen to us Moles. I'm the leader of The Moles, by the way. You may call me Pitch-Dark Hook the Great!"
 desc_HSR_hook_01_trait_leader: "Ha! Time to make some mischief!"
 desc_HSR_huohuo_01_trait: "Huohuo: H—Hello, I'm Huohuo, the newly appointed judge of the Ten-Lords Commission. Um... what else should I mention... Tail: Ahem... Uh, Hello? Don't forget to introduce the most famous heliobus of all. Huohuo: Ah, yes — Tail! This is Tail!"
 desc_HSR_huohuo_01_trait_leader: "Huohuo: D—Do we have to fight? Tail: Why, of course!"
 desc_HSR_hyacine_01_trait: "As the descendant of Sky, I, Hyacinthia, will fulfill the Flame-Chase duty with all of you. At the same time, I'll do my best to help everyone as Hyacine, healer of the Twilight Courtyard. This is my good friend and assistant, the little pegasus Ica. Do you want pet them? Please, go ahead! They love being petted~"
 desc_HSR_hyacine_01_trait_leader: "The future will be bright."
 desc_HSR_hysilens_01_trait: "Helektra? That name has long since sunk into the depths of the past... Ah, it's you, little gray fry. Call me Hysilens. I am the Knight Commander of the holy city, and I will remain on watch. I will not let the storms of fate cloud your eyes."
 desc_HSR_hysilens_01_trait_leader: "Careful. Don't let that silent wave open your throat."
 desc_HSR_jade_01_trait: "Hello, my name is Jade. I'm here at your request. If you'd like to take out a loan, you must put something of equal value up as collateral... Your dignity, your feelings, or even your life. What are you willing to exchange?"
 desc_HSR_jade_01_trait_leader: "You've got to lose some, to win some."
 desc_HSR_jiaoqiu_01_trait: "It's nice to meet you! I am Jiaoqiu, the Yaoqing's military healer, under the command of Feixiao, the Merlin's Claw. I suppose I'm also her advisor. What should you call me? Jiao, for short? Or Qiu, perhaps? I guess we're only saving ourselves one syllable either way."
 desc_HSR_jiaoqiu_01_trait_leader: "Let the enemy strike first, and then take them by surprise."
 desc_HSR_jingliu_01_trait: "To the Xianzhou, I am but an abandoned pawn — a wandering swordmaster. If you wish to avoid trouble, pretend we never met."
 desc_HSR_jingliu_01_trait_leader: "Tedious."
 desc_HSR_jingyuan_01_trait: "I am Jing Yuan, the general of the Luofu Cloud Knights. There's no need for formality. \"General\" is a temporary title, and you can simply call me Jing Yuan."
 desc_HSR_jingyuan_01_trait_leader: "Follow my charge."
 desc_HSR_kafka_01_trait: "Hi, Astral Expressers... Well, you caught me."
 desc_HSR_kafka_01_trait_leader: "May as well kill them all~"
 desc_HSR_lingsha_01_trait: "It's a pleasure to meet you. You may call me Lingsha. I have returned to serve as the Head of the Luofu's Alchemy Commission after completing my studies on the Zhuming. If you are feeling unwell, I can arrange a healer for you at any time."
 desc_HSR_lingsha_01_trait_leader: "How about we dissipate that foul stench quickly?"
 desc_HSR_luka_01_trait: "Oh, hey! I'm Luka, a member of Wildfire. Roughing up thugs and protecting the townsfolk is just part of my everyday job."
 desc_HSR_luka_01_trait_leader: "I could take you one arm only!"
 desc_HSR_luocha_01_trait: "I'm a traveling merchant, merely passing through. The name's Luocha."
 desc_HSR_luocha_01_trait_leader: "Pity. You chose the wrong enemy."
 desc_HSR_lynx_01_trait: "*sigh* So... I'm Lynx, a member of the Belobog Snow Plains research team. For work-related matters, please contact me during working hours. I'm unavailable at any other time. That's all, bye."
 desc_HSR_lynx_01_trait_leader: "Commencing research."
 desc_HSR_mar7th2_01_trait: "Ahem! Hello, Trailblazer. Welcome aboard the Astral Express. My name is March 7th, I'm one of the passengers. We'll be working together. First, we need to take your induction photo... Did that scare you! Just a joke~"
 desc_HSR_mar7th2_01_trait_leader: "You have the worst luck running into me."
 desc_HSR_mar7th_01_trait: "Ahem! Hello, Trailblazer. Welcome aboard the Astral Express. My name is March 7th, I'm one of the passengers. We'll be working together. First, we need to take your induction photo... Did that scare you! Just a joke~"
 desc_HSR_mar7th_01_trait_leader: "You have the worst luck running into me."
 desc_HSR_misha_01_trait: "Hi there, I'm Misha, a bellboy at The Reverie Hotel. Welcome to Penacony. This way. Oh, here, let me grab those bags for you!"
 desc_HSR_misha_01_trait_leader: "Let's dive into today's duties!"
 desc_HSR_mortenaxblade_01_trait: "I remember you, Trailblazer. Time has made us both sharper. Yet you are still you... and I am still me."
 desc_HSR_mortenaxblade_01_trait_leader: "All scores are settled here."
 desc_HSR_moze_01_trait: "My name is Moze. I am Feixiao's shadow guard. Please stand closer to this side so that you can block other people's view of me."
 desc_HSR_moze_01_trait_leader: "I am the blade..."
 desc_HSR_mydei_01_trait: "I am the crown prince of Kremnos \"Mydeimos,\" and also the warrior of Okhema \"Mydei.\" If you want to know me better, observe me in battle or fight me yourself."
 desc_HSR_mydei_01_trait_leader: "Come on, show me your courage."
 desc_HSR_natasha_01_trait: "Nice to meet you, I'm Natasha — an Underworld doctor. Feeling sick? Take a seat, let me take a look."
 desc_HSR_natasha_01_trait_leader: "Naughty children don't listen."
 desc_HSR_pela_01_trait: "Pelageya Sergeyevna, Silvermane Guards Intelligence Officer, at your service. You can call me Pela."
 desc_HSR_pela_01_trait_leader: "Commencing support."
 desc_HSR_phainon_01_trait: "I'm Phainon of Aedes Elysiae. Greetings. As fellow outlanders in Okhema, our meeting is surely fate's design. Come. Maybe we'll even have a chance to fight alongside each other in the future."
 desc_HSR_phainon_01_trait_leader: "There's no other choice but to move forward."
 desc_HSR_playerboy2_01_trait: "Trailblazer, a 5-star 存护 character of Astral Express."
 desc_HSR_playerboy2_01_trait_leader: "Let's go."
 desc_HSR_playerboy3_01_trait: "Trailblazer, a 5-star 同谐 character of Astral Express."
 desc_HSR_playerboy3_01_trait_leader: "Let's go."
 desc_HSR_playerboy4_01_trait: "Trailblazer, a 5-star 记忆 character of Astral Express."
 desc_HSR_playerboy4_01_trait_leader: "Let's go."
 desc_HSR_playerboy5_01_trait: "Trailblazer, a 5-star 欢愉 character of Astral Express."
 desc_HSR_playerboy5_01_trait_leader: "Let's go."
 desc_HSR_playerboy_01_trait: "Trailblazer, a 5-star 毁灭 character of Astral Express."
 desc_HSR_playerboy_01_trait_leader: "Let's go."
 desc_HSR_playergirl2_01_trait: "Trailblazer, a 5-star 存护 character of Astral Express."
 desc_HSR_playergirl2_01_trait_leader: "Let's go."
 desc_HSR_playergirl3_01_trait: "Trailblazer, a 5-star 同谐 character of Astral Express."
 desc_HSR_playergirl3_01_trait_leader: "Let's go."
 desc_HSR_playergirl4_01_trait: "Trailblazer, a 5-star 记忆 character of Astral Express."
 desc_HSR_playergirl4_01_trait_leader: "Let's go."
 desc_HSR_playergirl5_01_trait: "Trailblazer, a 5-star 欢愉 character of Astral Express."
 desc_HSR_playergirl5_01_trait_leader: "Let's go."
 desc_HSR_playergirl_01_trait: "Trailblazer, a 5-star 毁灭 character of Astral Express."
 desc_HSR_playergirl_01_trait_leader: "Let's go."
 desc_HSR_qingque_01_trait: "I'm Qingque, a diviner from the Divination Commission. You wanna play Celestial Jade? Okay, come back during my work hours."
 desc_HSR_qingque_01_trait_leader: "Wait for the tiles before you start counting~"
 desc_HSR_rappa_01_trait: "Long time no see, Baseball Bat Ninja! Your way of the ninja shines like a thousand rays of light. As the Cosmic Ninjutsu Inscriptions read, \"At the end of hell, there is light that illuminates all the darkness in the world.\""
 desc_HSR_rappa_01_trait_leader: "Dazzling Ninja , here to vanquish!"
 desc_HSR_robin_01_trait: "Hello, good evening! I'm Robin, a singer from The Family. No need for formalities, this is just a friendly off-stage chat. Can you spare me a moment?"
 desc_HSR_robin_01_trait_leader: "May song bring us victory."
 desc_HSR_robinsummeretto_01_trait: "It's nice to see you again. The weather in Astropolis is wonderful, and the moist breeze is filled with the scent of sunshine... I'm hoping to gather inspiration for a new song. Would you like to take a stroll together on the beach and listen to the whispers of the sea in the shells?"
 desc_HSR_robinsummeretto_01_trait_leader: "May my song be a gentle breeze that carries away all troubles."
 desc_HSR_ruanmei_01_trait: "My name is Ruan Mei. When saying my name, please don't run the syllables together."
 desc_HSR_ruanmei_01_trait_leader: "You hold some academic value, I suppose..."
 desc_HSR_saber_01_trait: "Are you my Master? My sword is yours to command. I will give it my all to bring you victory."
 desc_HSR_saber_01_trait_leader: "The battle has begun? Please give your command, Master."
 desc_HSR_sam_01_trait: "Hi, we meet again... What I mean is, it's nice to see you. Just call me Firefly, as always."
 desc_HSR_sam_01_trait_leader: "Sam, in position."
 desc_HSR_sampo_01_trait: "Hey, Trailblazer! Y'know, with Sampo Koski by your side, you've got a businessman, chaperone, and problem-solving conversationalist, all rolled into one! Pretty sweet deal, huh?"
 desc_HSR_sampo_01_trait_leader: "Sampo Koski always takes care of his friends."
 desc_HSR_seele_01_trait: "Hey, I'm Seele. I'm a member of Wildfire down here in the Underworld. Wanna help me forge a future for the people?"
 desc_HSR_seele_01_trait_leader: "What a headache."
 desc_HSR_serval_01_trait: "Hi Trailblazer, the name's Serval Landau, I'm a Belobog mechanic. Of course, that's really just what I do on the side — rock 'n' roll is my main occupation."
 desc_HSR_serval_01_trait_leader: "Pretty good crowd today."
 desc_HSR_silverwolf_01_trait: "Hey, Trailblazer, you seem pretty cool. That Stellaron hasn't affected you at all?"
 desc_HSR_silverwolf_01_trait_leader: "Can you let me have some fun this time?"
 desc_HSR_silverwolflv999_01_trait: "LV. 999 mode, my final form, first time seeing it, right? Let's hit up a high-difficulty Raid. I'll carry you. One-button clear."
 desc_HSR_silverwolflv999_01_trait_leader: "Absolute top-tier play."
 desc_HSR_sparkle_01_trait: "Hey hey, I'm Sparkle! Got any cool, daring quests or risky biz? Just hit me up! If it piques my interest we can talk money. The main thing is about having a riot of a time, right?"
 desc_HSR_sparkle_01_trait_leader: "Why don't you stay and play for a while?"
 desc_HSR_sparxie_01_trait: "Hey there, Galactic Baseballer, welcome to the stream! I'm your good friend, Sparxie~ Are you ready for a day overflowing with dopamine? The world is full of sparkle, so don't forget to shine brightly just like Sparxie!"
 desc_HSR_sparxie_01_trait_leader: "Game is on~ Leave a like~"
 desc_HSR_sunday_01_trait: "Every reunion is also a new encounter. Hello, I am \"Sunday,\" a humble passenger."
 desc_HSR_sunday_01_trait_leader: "I will overcome the thorns."
 desc_HSR_sushang_01_trait: "I'm Sushang, and I recently joined the Cloud Knights. Talk to me if you have any issues... but I don't know the Luofu very well either, hehe."
 desc_HSR_sushang_01_trait_leader: "Let me through, or I'll go through you."
 desc_HSR_theherta_01_trait: "You don't recognize me? I've told you who I am already — human, female, young, beautiful, attractive."
 desc_HSR_theherta_01_trait_leader: "What's wrong? Never seen perfection up close before?"
 desc_HSR_tingyun_01_trait: "My name is Tingyun, the Amicassador for the Luofu Sky-Faring Commission merchant guild. Please look after me from now on, benefactor."
 desc_HSR_tingyun_01_trait_leader: "Customers are always welcome."
 desc_HSR_tohsakarin_01_trait: "The contract is complete. Relax, I'm not really one for strict hierarchies... well, not for most people, anyway. Got that, my Servant?"
 desc_HSR_tohsakarin_01_trait_leader: "With elegance and poise, I give my absolute all!"
 desc_HSR_topaz_01_trait: "Hello! Allow me to introduce myself. My name's Topaz — I work in the IPC's Strategic Investment Department. I've heard about the many great feats of the Nameless and the Astral Express — it's truly a pleasure to meet you. Oh, hehe, and this is my little second-in-command — Numby! Say hi to everyone, Numby!"
 desc_HSR_topaz_01_trait_leader: "Let the asset valuation begin."
 desc_HSR_tribbie_01_trait: "Tribbie: We are Tribbie — the \"messenger\" delivering prophecies~ Trianne: We are Trianne — the \"gatekeeper\" traversing a hundred worlds! Trinnon: We are Trinnon — the \"priest\" listening to the prophecy of the gods. Tribbie, Trinnon, and Trianne: We are Tribios — the \"Holy Maiden of Janusopolis.\" Please join us on our journey to the end of the west wind, where fresh flowers bloom."
 desc_HSR_tribbie_01_trait_leader: "Underestimating us will cost you."
 desc_HSR_welt_01_trait: "Hi, I'm Welt Yang. If there's something you need help with, you can come find me anytime."
 desc_HSR_welt_01_trait_leader: "Leave the rest to me."
 desc_HSR_xueyi_01_trait: "I am Xueyi, a judge of the Ten-Lords Commission. By decree of the Commission, I come to the world of the living to enforce its will. Tell me what you want. I haven't got much time."
 desc_HSR_xueyi_01_trait_leader: "It's time."
 desc_HSR_yanqing_01_trait: "Yanqing, lieutenant of the Luofu Cloud Knights, reporting in! If you have some free time, Trailblazer, would you mind sparring with me? Don't worry. I won't go easy on you."
 desc_HSR_yanqing_01_trait_leader: "So, how many of my moves can you block?"
 desc_HSR_yaoguang_01_trait: "I am General Yao Guang, Seer Strategist aboard the Xianzhou Yuque. Like everyone else, you may simply call me Madam Yao. It's true, I could have divined the finer details of this encounter, but where's the fun in that? Being here in person has turned up some rather pleasant surprises."
 desc_HSR_yaoguang_01_trait_leader: "Divination tells me that this will hurt."
 desc_HSR_yukong_01_trait: "Hello, guest from the Astral Express. I am Yukong from the Luofu's Sky-Faring Commission. Welcome to the Xianzhou."
 desc_HSR_yukong_01_trait_leader: "A pilot's spirit never dies."
 desc_HSR_yunli_01_trait: "I am Yunli. Come, take up your sword. We'll get to know each other once we've sparred."
 desc_HSR_yunli_01_trait_leader: "The outcome lies within the self, not the sword."
