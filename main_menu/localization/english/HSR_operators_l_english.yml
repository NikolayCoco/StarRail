 desc_HSR_misha_01_trait: "我是「白日梦酒店」的门童米沙，欢迎来到匹诺康尼，请这边走，我来为你搬运行李！"
 desc_HSR_misha_01_trait_leader: "开始今天的工作吧…！"
 desc_HSR_mortenaxblade_01_trait: "我记得你，开拓者。岁月锤炼，我们都变得更为锋利，但你还是你，我也还是我。"
 desc_HSR_mortenaxblade_01_trait_leader: "所有恩怨，都就此作别。"
 desc_HSR_moze_01_trait: "我叫貊泽，是飞霄的影卫。请往这侧站一些，这样能挡住别人观察我的视线。"
 desc_HSR_moze_01_trait_leader: "我，即是锋刃……"
 desc_HSR_mydei_01_trait: "我是悬锋的王储「迈德漠斯」，亦是奥赫玛的战士「万敌」。若想了解更多，便观我一战，或与我一战。"
 desc_HSR_mydei_01_trait_leader: "来吧，向我展现你的勇气。"
 desc_HSR_natasha_01_trait: "你好，我是娜塔莎，贝洛伯格下层区的医生，哪里不舒服么？过来坐吧，让我看看。"
 desc_HSR_natasha_01_trait_leader: "不听话的都是坏孩子。"
 desc_HSR_pela_01_trait: "银鬃铁卫情报官，佩拉格娅•谢尔盖耶夫娜前来报到。你可以叫我佩拉。"
 desc_HSR_pela_01_trait_leader: "开始介入支援。"
 desc_HSR_phainon_01_trait: "哀丽秘榭的白厄，向你致意。同为奥赫玛的异乡人，相聚即是缘分。随我来，说不定我们以后还有并肩作战的时候。"
 desc_HSR_phainon_01_trait_leader: "除了向前，别无选择。"
