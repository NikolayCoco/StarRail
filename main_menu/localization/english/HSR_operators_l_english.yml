 desc_HSR_qingque_01_trait: "我是青雀，太卜司的卜者。要找我打牌？行，等我上班时间来好吧？"
 desc_HSR_qingque_01_trait_leader: "算了也白算，等等牌就来~"
 desc_HSR_rappa_01_trait: "别来无恙，球棒•忍者！阁下之忍道有如万丈光芒，《银河忍法帖》有云：「地狱之端必有光明，照尽世间黑暗。」"
 desc_HSR_rappa_01_trait_leader: "缭乱•忍侠，前来讨伐！"
 desc_HSR_robin_01_trait: "晚上好，我是来自家族的歌者知更鸟。不必拘谨，这只是一次舞台下的私人问候，能为我抽些时间吗？"
 desc_HSR_robin_01_trait_leader: "愿歌声为我们带来胜利。"
 desc_HSR_robinsummeretto_01_trait: "好久不见呀。千星城的天气真好，湿润的风里满是阳光的味道……正想为新歌收集一些灵感，要不要一起去沙滩上走走，听听海螺的回声？"
 desc_HSR_robinsummeretto_01_trait_leader: "愿歌声化作微风，吹走烦恼。"
 desc_HSR_ruanmei_01_trait: "我叫阮•梅，念我名字时，请别忘了中间气息的停歇。"
 desc_HSR_ruanmei_01_trait_leader: "你们仍有值得研究的价值。"
 desc_HSR_saber_01_trait: "你就是我的御主吗？我的剑将由你差遣。我会全力以赴，为你带来胜利。"
 desc_HSR_saber_01_trait_leader: "战斗开始了？请下达指令，御主。"
 desc_HSR_sam_01_trait: "嗨，又见面啦…我的意思，很高兴见到你。和往常一样，叫我「流萤」吧。"
 desc_HSR_sam_01_trait_leader: "萨姆，已就位。"
 desc_HSR_sampo_01_trait: "嗨，开拓者，有我桑博•科斯基在身边，你就相当于同时拥有一个行商、向导、解闷的聊天对象…怎么样，够划算吧？"
 desc_HSR_sampo_01_trait_leader: "我桑博一向关照朋友。"
 desc_HSR_seele_01_trait: "哟，我是希儿，贝洛伯格下层区「地火」的成员，你要和我一同见证下层区的未来么？"
 desc_HSR_seele_01_trait_leader: "纠缠不清。"
 desc_HSR_serval_01_trait: "嗨，开拓者，我是希露瓦•朗道，贝洛伯格的机械师——当然，这是一份兴趣使然的工作，摇滚演出才是我的主业。"
 desc_HSR_serval_01_trait_leader: "捧场的人还不少。"
 desc_HSR_silverwolf_01_trait: "哟，开拓者，感觉你挺不错的呀，那颗星核对你没什么影响吗？"
 desc_HSR_silverwolf_01_trait_leader: "这次能让我玩得开心点么？"
 desc_HSR_silverwolflv999_01_trait: "LV.999的形态，完全的我，第一次见吧？高难副本走起，我带你，一键通关。"
 desc_HSR_silverwolflv999_01_trait_leader: "天花板级别的操作。"
 desc_HSR_sparkle_01_trait: "你好你好，我是花火！你要是有什么危险的差事要办，尽管来找我。毕竟只要我感兴趣，价钱都好商量。关键是要玩得开心，对吧？"
 desc_HSR_sparkle_01_trait_leader: "今天陪我多玩一会儿，好么？"
 desc_HSR_sparxie_01_trait: "欢迎「银河球棒侠」加入直播间！我是你的好朋友「火花」，准备好开启多巴胺满满的一天了吗？花花世界迷人眼，今天也要像火花一样耀眼哦~"
 desc_HSR_sparxie_01_trait_leader: "好戏开场点点赞点点关注哦~"
 desc_HSR_sunday_01_trait: "每一次重逢也是新的相遇。你好，我是「星期日」，一介普通的搭车客。"
 desc_HSR_sunday_01_trait_leader: "我将越过荆棘。"
 desc_HSR_sushang_01_trait: "我叫素裳，最近刚加入云骑军。你有事儿就和我说吧…虽然，我对「罗浮」也不熟，嘿嘿。"
 desc_HSR_sushang_01_trait_leader: "再不让开，就要挨揍啦。"
 desc_HSR_theherta_01_trait: "不认识我了？早和你说过——人类，女性，年轻，貌美，可爱。"
 desc_HSR_theherta_01_trait_leader: "怎么，没见过好看的？"
 desc_HSR_tingyun_01_trait: "小女子名作停云，「罗浮」天舶司商团接渡使。接下来还要多多仰仗恩公啦。"
 desc_HSR_tingyun_01_trait_leader: "客人嘛，岂有不招待的道理。"
 desc_HSR_tohsakarin_01_trait: "契约完成。别担心，我不喜欢那种阶级分明的关系…至少对绝大多数人是这样啦。记好了吗，我的从者？"
 desc_HSR_tohsakarin_01_trait_leader: "优雅、从容，全力以赴！"
 desc_HSR_topaz_01_trait: "初次见面，请容许我做个简单的自我介绍。我叫托帕，隶属星际和平公司的战略投资部。星穹列车和无名客，各位的事迹我早有耳闻，幸会！身边这位，就是我的好搭档啦。账账，来和大家打个招呼！"
 desc_HSR_topaz_01_trait_leader: "开始吧，资产评估。"
 desc_HSR_tribbie_01_trait: "缇宝：*我们*是缇宝——传递预言的「信使」~缇安：*我们*是缇安——穿梭百界的「门匠」！缇宁：*我们*是缇宁——聆听神谕的「祭司」。缇宝&缇宁&缇安：*我们*是缇里西庇俄丝——「雅努萨波利斯的圣女」，欢迎和我们同行，一同到达鲜花芬芳的西风尽头。"
 desc_HSR_tribbie_01_trait_leader: "小瞧我们可是会吃亏的。"
 desc_HSR_welt_01_trait: "你好，我是瓦尔特•杨，遇到任何困难，欢迎随时来找我。"
 desc_HSR_welt_01_trait_leader: "接下来，就交给我吧。"
 desc_HSR_xueyi_01_trait: "十王司判官，雪衣。奉十王诰谕还阳行事。有事便讲，吾的时间不多。"
 desc_HSR_xueyi_01_trait_leader: "时辰已至。"
 desc_HSR_yanqing_01_trait: "「罗浮」云骑军骁卫彦卿，前来报到！开拓者老师有空的话，就来同彦卿切磋一下吧？放心，我可不会因为对手是老师您就手下留情。"
 desc_HSR_yanqing_01_trait_leader: "哦？你能接我几招？"
 desc_HSR_yaoguang_01_trait: "我是爻光，仙舟「玉阙」的戎韬将军，你就同他人一样，叫我「爻老板」吧。此次会面，诸般细节本可用卜算预见，但本座还是更想亲身经历一番——果然，有许多意外之喜。"
 desc_HSR_yaoguang_01_trait_leader: "卜签告诉我，你会受些皮肉之苦。"
 desc_HSR_yukong_01_trait: "你好，「星穹列车」的客人，我是「罗浮」天舶司的驭空，欢迎来到仙舟做客。"
 desc_HSR_yukong_01_trait_leader: "飞行士的斗志，从未熄灭。"
 desc_HSR_yunli_01_trait: "我是云璃。来吧，拿上你的剑，我们交一次手，就算认识了。"
 desc_HSR_yunli_01_trait_leader: "胜负在人，而不在剑。"
