 desc_HSR_acheron_01_trait: "「黄泉」…虽然只是借来的名字，但你知道我是怎样的人，记得我做过怎样的事，如此之后…我便是黄泉。"
 desc_HSR_acheron_01_trait_leader: "来到此处，是你…还是命途的意愿？"
 desc_HSR_aglaea_01_trait: "远道而来的贵客，风儿顺着金丝捎来了你的讯息。我名阿格莱雅，奥赫玛的改衣师，翁法罗斯的黄金裔之一。愿我们坦诚相待。"
 desc_HSR_aglaea_01_trait_leader: "在紧张么？你的气息乱了。"
 desc_HSR_anaxa_01_trait: "我名为阿那克萨戈拉斯，神悟树庭七贤人之一，「智种学派」的创立者。不必我多说了，第一，别叫我那刻夏。第二，别打断我——沉默是金。切记。"
 desc_HSR_anaxa_01_trait_leader: "怎么了？有事吗？"
 desc_HSR_archer_01_trait: "初次见面，叫我Archer就好。幸好你我并不是需要相互厮杀的关系，那就尽可能友好相处吧。"
 desc_HSR_archer_01_trait_leader: "到我了？真是够忙的。"
 desc_HSR_argenti_01_trait: "我是「纯美骑士团」的银枝。我谨在此，以一朵玫瑰的沉重份量，向你致意。"
 desc_HSR_argenti_01_trait_leader: "我向一朵玫瑰起誓。"
 desc_HSR_arlan_01_trait: "你好，开拓者，我是空间站「黑塔」的防卫科负责人阿兰，在空间站期间，我会全力护你安全。"
 desc_HSR_arlan_01_trait_leader: "战斗才能取胜。"
 desc_HSR_ashveil_01_trait: "在下是「不死神探事务所」的名侦探不死途，这是事务所的名片。我接取各类委托，不管是寻找走失狗猫，冒充家长参会，或者抓捕星际通缉犯，追查星神的下落——你想委托什么？"
 desc_HSR_ashveil_01_trait_leader: "直觉告诉我，你很可疑。"
 desc_HSR_asta_01_trait: "嗨，开拓者，我是空间站「黑塔」的站长艾丝妲。要你帮忙的时候，我一定告诉你…你放心，不和你客气。"
 desc_HSR_asta_01_trait_leader: "真是不懂礼貌的客人。"
 desc_HSR_aventurine_01_trait: "不才「砂金」，隶属星际和平公司战略投资部，不良资产清算专家之一…当然，也可以是你的朋友。"
 desc_HSR_aventurine_01_trait_leader: "准备下注。"
 desc_HSR_aventurinewaveflair_01_trait: "朋友，又见面了！刚刚结束代言拍摄，在镜头前维持笑容还真是个体力活。不过好在升完P46之后，总算有空好好休假了。想和我一起放松下么？我保证会给你一个难以忘怀的假期。"
 desc_HSR_aventurinewaveflair_01_trait_leader: "暗流汹涌…该入场了。"
 desc_HSR_bailu_01_trait: "我是白露，丹鼎司的医士。来来，过来让我瞅瞅，你怎么回事，哪儿不舒服啦？"
 desc_HSR_bailu_01_trait_leader: "哎哟你病得不轻啊！"
