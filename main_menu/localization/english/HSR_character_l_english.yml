 HSR_character_events.1.title: "Warp: [target_character.GetName]"
 HSR_character_events.1.desc: "The Astral Express's express ticket, recording the coordinates of a certain world — suited to passengers with a clear destination.\n#italic Have you friends you have not seen in a long while? Board the train and journey with him, her, it, or Them!#!\n\nThe Astral Express's regular ticket. Follow the star rails onward, and travel among the worlds open to passage.\n#italic Go wherever you wish, meet whomever you wish to meet, and keep the memories you wish to keep.#!"
 HSR_character_events.1.desc_immortal: "$HSR_character_events.1.desc$\n\n#italic [target_character.GetName] has weathered the long years and possesses a long lifespan.#!"
 HSR_character_events.1.desc_child: "$HSR_character_events.1.desc$\n\n#italic [target_character.GetName] is still but a child, and will formally take part in affairs after reaching the age of 16.#!"
 HSR_character_events.1.a: "Welcome aboard the Astral Express"

