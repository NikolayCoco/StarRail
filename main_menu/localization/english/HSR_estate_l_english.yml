l_english:
 hsr_trailblazer: "Trailblazers"
 hsr_trailblazer_desc: "They come from every corner of the galaxy — cast toward the star-sea by fate, yet all chose to walk alongside the Astral Express.\nNow, they cross worlds to our side, willing to lend their skills and loyalty to our country."
 hsr_pop: "Trailblazers"
 hsr_pop_desc: "These Trailblazers represent travelers from the Astral Express."
 MODIFIER_TYPE_NAME_hsr_trailblazer_target_satisfaction: "$hsr_trailblazer$ Satisfaction Equilibrium"
 MODIFIER_TYPE_DESC_hsr_trailblazer_target_satisfaction: "This affects the [estate_satisfaction_equilibrium|e] of the $hsr_trailblazer$ in this [country|e]."
 MODIFIER_TYPE_NAME_hsr_trailblazer_satisfaction_decay: "$hsr_trailblazer$ Satisfaction Decay"
 MODIFIER_TYPE_DESC_hsr_trailblazer_satisfaction_decay: "This affects how quickly the $hsr_trailblazer$'s [estate_satisfaction|e] decays toward its [estate_satisfaction_equilibrium|e] in this [country|e]."
 MODIFIER_TYPE_NAME_hsr_trailblazer_satisfaction_recovery: "$hsr_trailblazer$ Satisfaction Recovery"
 MODIFIER_TYPE_DESC_hsr_trailblazer_satisfaction_recovery: "This affects how quickly the $hsr_trailblazer$'s [estate_satisfaction|e] recovers toward its [estate_satisfaction_equilibrium|e] in this [country|e]."
 MODIFIER_TYPE_NAME_global_hsr_trailblazer_power: "$hsr_trailblazer$ [estate_power|e]"
 MODIFIER_TYPE_DESC_global_hsr_trailblazer_power: "This affects the $hsr_trailblazer$'s [estate_power|e] in this [country|e]."
 MODIFIER_TYPE_NAME_local_hsr_trailblazer_power: "Local $hsr_trailblazer$ [estate_power|e]"
 MODIFIER_TYPE_DESC_local_hsr_trailblazer_power: "This affects the $hsr_trailblazer$'s [estate_power|e] in this [location|e]."
 MODIFIER_TYPE_NAME_hsr_trailblazer_allowed_in_cabinet: "$hsr_trailblazer$ Allowed in Cabinet"
 MODIFIER_TYPE_DESC_hsr_trailblazer_allowed_in_cabinet: "This allows [ShowEstateTypeName('hsr_trailblazer')][estate|e][characters|e] to serve in the [cabinet|e]."
 MODIFIER_TYPE_NAME_hsr_trailblazer_allowed_leading_military: "$hsr_trailblazer$ Allowed to Lead Army"
 MODIFIER_TYPE_DESC_hsr_trailblazer_allowed_leading_military: "This allows [ShowEstateTypeName('hsr_trailblazer')][estate|e][characters|e] to serve as [generals|e] or [admirals|e]."
 hsr_trailblazer_satisfaction: "[ShowEstateTypeName('hsr_trailblazer')][estate_satisfaction|e]"
 hsr_trailblazer_power: "[ShowEstateTypeName('hsr_trailblazer')][estate_power|e]"
 hsr_trailblazer_base: "Unify the Trailblazer Community"
 hsr_trailblazer_base_desc: "Travelers come from all over the galaxy with varied customs. To let them better serve in state affairs, we should unify the scattered Trailblazer communities and grant them formal standing and treatment.\n#G This is the basis of the other privileges.#!"
 hsr_trailblazer_physical: "Employ @physical!Physical Characters"
 hsr_trailblazer_physical_desc: "@physical!Physical characters face the enemy with stout bodies. Their training can boost our army's strength and mobilization."
 hsr_trailblazer_fire: "Employ @fire!Fire Characters"
 hsr_trailblazer_fire_desc: "@fire!Fire characters demolish enemy lines with scorching assaults. Their combat style can enhance siege and firepower suppression."
 hsr_trailblazer_ice: "Employ @ice!Ice Characters"
 hsr_trailblazer_ice_desc: "@ice!Ice characters freeze the front line with frost. Their experience can fortify defenses and reduce attrition."
 hsr_trailblazer_lightning: "Employ @lightning!Lightning Characters"
 hsr_trailblazer_lightning_desc: "@lightning!Lightning characters strike into the fray with thunder. Their tactics can boost cavalry and mobile troops."
 hsr_trailblazer_wind: "Employ @wind!Wind Characters"
 hsr_trailblazer_wind_desc: "@wind!Wind characters are light as wind, coming and going unseen. Their methods can greatly increase troop deployment speed."
 hsr_trailblazer_quantum: "Employ @quantum!Quantum Characters"
 hsr_trailblazer_quantum_desc: "@quantum!Quantum characters manipulate the mysteries of spacetime. Their abilities help stabilize the realm and maintain order."
 hsr_trailblazer_imaginary: "Employ @imaginary!Imaginary Characters"
 hsr_trailblazer_imaginary_desc: "@imaginary!Imaginary characters comprehend the principles of the imaginary. Their research can inspire our science and strengthen the army."
 hsr_trailblazer_leader: "Grant the Trailblazers Military Command"
 hsr_trailblazer_leader_desc: "Allow Trailblazers to lead armies."
 hsr_trailblazer_advisor: "Grant the Trailblazers Advisory Rights"
 hsr_trailblazer_advisor_desc: "Allow Trailblazers to offer counsel."
 hsr_trailblazer_rule: "Grant the Trailblazers Governing Rights"
 hsr_trailblazer_rule_desc: "Allow Trailblazers to govern a region or even lead the entire nation.\n#G Allow Trailblazers to become the country's ruler.#!\n#G Allow dispatching Trailblazers to govern a subject nation.#!"
