l_english:
 HSR_express_IO: "Astral Express"
 HSR_express_IO_desc: "#italic \"May this journey lead us starward!\"#!"
 HSR_express_desc: "The Astral Express met us amid the star-sea. Aboard are travelers from many worlds — Trailblazers, Nameless ones, and companions. They are willing to journey with us to unknown planets, and to lend their skills and loyalty to our country."
 HSR_express_IO_hint_title: "$HSR_events.1.title$"
 HSR_express_IO_hint_desc: "$HSR_events.1.desc$"
 HSR_StellarJade: "@StellarJade!Stellar Jade"
 HSR_StellarJade_desc: "A strange crystal born of the depths of the starry sky. It is the reward the Astral Express pays passengers, and a rare currency that circulates across the cosmos."
 HSR_StellarJade_Change: "Monthly Change"
 HSR_StellarJade_Change_Value: "Gain #P 60#!@StellarJade! each month. If you hold the #italic Nameless Honor#!, gain an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_Welkin: "@Welkin!Nameless Honor"
 HSR_Welkin_desc: "A monthly companion pass settled by the Astral Express. Upon signing, immediately gain #P 300#!@StellarJade!, then an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_has_Welkin_text: "（Nameless Honor remaining[GetPlayer.MakeScope.GetVariable('HSR_Welkin_months').GetValue]/30 months）"
 HSR_Pay_30: "@Welkin!Buy Nameless Honor"
 HSR_Pay_30_desc: "Claim the Nameless Honor: spend #N -300#!@gold!, immediately gain #P 300#!@StellarJade!, and receive #italic Nameless Honor#!: an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_Pay_30_tooltip_1: "Gain #P 300#!@StellarJade!"
 HSR_Pay_30_tooltip_2: "Receive #italic Nameless Honor#!: an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_Pay_648: "@StellarJade!Stellar Jade Bundle"
 HSR_Pay_648_desc: "Buy the Stellar Jade bundle: spend #N -6480#!@gold!, gain #P 12960#!@StellarJade!."
 HSR_Pay_648_tooltip: "Gain #P 12960#!@StellarJade!"
 HSR_create_character: "@Warp!Warp"
 HSR_create_character_desc: "The Astral Express's warp engine can leap across the star-sea and bring back someone who will walk with you. This time, who will it bring?"
 HSR_exist_operator_tooltip: "There are characters that can be obtained via Warp"
 HSR_create_character_random_tooltip: "Randomly gain #P one#! character."
 HSR_create_pop: "Trailblazer Registration"
 HSR_create_pop_desc: "Register new Trailblazers at an Astral Express station to keep its crew sufficient."
 HSR_create_pop_tooltip: "Add #P 10#! Trailblazers to one Astral Express station (if it is not yet full)."
 HSR_StellarJade_for_golden: "@gold!Stellar Jade to Gold"
 HSR_StellarJade_for_golden_desc: "If you have surplus Stellar Jade or are in urgent need of gold, exchange it at a 1:10 rate."
 HSR_Pay_1600_tooltip: "Spend #N -1600#!@StellarJade!."
