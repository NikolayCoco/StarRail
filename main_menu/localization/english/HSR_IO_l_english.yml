l_english:
 HSR_express_IO: "Astral Express"
 HSR_express_IO_desc: "#italic \"Per aspera ad astra!\"#!"
 HSR_express_desc: "The Astral Express met us amid the star-sea. Aboard are travelers from many worlds. They are willing to journey with us to unknown planets, and offer their skills and loyalty to our country."
 HSR_express_IO_hint_title: "$HSR_events.1.title$"
 HSR_express_IO_hint_desc: "$HSR_events.1.desc$"
 HSR_StellarJade: "@StellarJade! Stellar Jade"
 HSR_StellarJade_desc: "@StellarJade! A fleeting gleam arrowing across the night sky. Catch it before it's gone. Maybe it can be used to barter?\n#italic \"Some say that the lights are wishes of sentient beings. While insignificant and elusive, they did light up the pocket of sky around them, right?\"#!"
 HSR_Pay_30: "@SupplyPass! Buy Express Supply Pass"
 HSR_supply_text: "@SupplyPass! Provisions prepared by the Express for Trailblazers. Claim with pass.\n#italic \"Dear conductor, can we not punch holes in the cards? I want to collect a whole collection of them.\"#!"
 HSR_Pay_30_desc: "$HSR_supply_text$\n\n#italic @SupplyPass!The most cost-effective month pass!#!"
 HSR_Pay_30_desc_2: "Spend #N -30#!@gold!, immediately gain #P 300#!@StellarJade!, and receive #italic Express Supply Pass@SupplyPass!#!: an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_Pay_30_tooltip_1: "Gain #P 300#!@StellarJade!"
 HSR_Pay_30_tooltip_2: "Receive #italic Express Supply Pass@SupplyPass!#!: an additional #P 90#!@StellarJade! per month for 30 months."
 HSR_Pay_648: "@OneiricShard! One-time Supply for the Astral Express"
 HSR_Pay_648_desc: "@OneiricShard! Crystallized lights floating in the sea of stars, pulsing with the residual dream of an ancient leviathan. Everything of the old world turned in the end into candlelight that illuminates the darkness ahead.\n\n#italic @OneiricShard! Double the value, never expires!#!"
 HSR_Pay_648_desc_2: "Spend #N -648#!@gold!, immediately gain #P 12960#!@StellarJade!."
 HSR_Pay_648_tooltip: "Gain #P 12960#!@StellarJade!"
 HSR_StellarJade_Change: "Monthly Change"
 HSR_StellarJade_Change_Value: "Gain a fixed #P 60#!@StellarJade! each month. If you have purchased the #italic Express Supply Pass@SupplyPass!#!, gain an additional #P 90#!@StellarJade! per month."
 HSR_has_Welkin_text: "(Express Supply Pass remaining [GetPlayer.MakeScope.GetVariable('HSR_Welkin_months').GetValue] months)"
 HSR_create_character: "@SpecialPass! Warp a Character"
 HSR_create_character_desc: "@SpecialPass! Direct ticket for the Astral Express with coordinates of specific worlds, suitable for passengers who just want to go from point A to point B.\n#italic \"Need to catch up with an old friend? Hop on and see the universe with him/her/it/THEM!\"#!\n\n#italic @IntertwinedFate!Invite a Honkai: Star Rail character to join our country!#!"
 HSR_exist_operator_tooltip: "There are characters that can be obtained via Warp"
 HSR_create_character_random_tooltip: "Randomly gain #P one#! character."
 HSR_create_pop: "@Pass! Warp a Trailblazer"
 HSR_create_pop_desc: "@Pass! Astral Express Universal Pass. Travel as far as the Star Rail stretches.\n#italic \"Map worlds, meet people, make memories.\"#!\n\n#italic @AcquaintFate!Invite a Trailblazer to fill the empty seats at our Astral Express station.#!"
 HSR_create_pop_tooltip: "Add #P 10#! Trailblazers to one Astral Express station (if it is not yet fully staffed)."
 HSR_Pay_1600_tooltip: "Spend #N -1600#!@StellarJade!."
 HSR_StellarJade_for_golden: "@gold! Exchange Stellar Jade for Gold"
 HSR_StellarJade_for_golden_desc: "When you have surplus Stellar Jade or need gold in an emergency, convert Stellar Jade into gold."
