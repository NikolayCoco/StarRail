l_english:
 HSR_events.1.title: "Honkai: Star Rail mod overview"
 HSR_events.1.desc: "#G Welcome aboard, Trailblazer!#!\n\n#E 【How to use】#!\nBuild the Astral Express building in your capital to begin experiencing this mod.\n\n#E Building Astral Express:#! A dwelling of the Astral Express on the land, where Trailblazers reside, helping the locale to pioneer new land and prosper!\nThe Astral Express must first be built in the capital (headquarters), before it can be built elsewhere (branch).\nBuilding it in the capital provides the whole country with [colonization|e] and exploration support; building it elsewhere provides local pioneering and protection, and boosts local prosperity. You can help your subjects build it.\nRequires employing Trailblazers.\n\n#E International Organization Astral Express:#! Build the Astral Express building in your capital to join.\nAccumulate Stellar Jade over time; spend it on Warp (gacha) and Trailblazer Registration.\nIf you help a subject build the Astral Express in its capital, that subject also joins the organization, accumulates Stellar Jade, and recruits characters.\n\n#E Characters and the Trailblazer estate:#!\nCharacters belong to the Trailblazer [estate|e]. After granting [estate_privilege|e], you can hire them into the [cabinet|e] or make them [commander|e], or even ruler of your [subject|e].\nThe Astral Express building requires Trailblazers to function.\nAfter annexing other countries, you gain their characters.\n\n#E Exploration and colonization:#! The Astral Express grants [colonization|e] ability to locales and the country: stations and the headquarters assist in opening new frontiers, increasing colonial range and migration.\n\n#E UI Discovery:#! Society - Population - Characters\nHere you can browse all characters you possess; remember to check after Warp!"
 HSR_events.1.a: "\"May this journey lead us starward!\""
 HSR_events.1.b: "EU5 is too hard, I want the newbie subsidy!"
 STATIC_MODIFIER_NAME_HSR_start: "Astral Express Cooperation"
 STATIC_MODIFIER_DESC_HSR_start: "We have established long-term cooperation with the Astral Express. The cooperation fees it pays will be credited regularly."
