l_english:
 HSR_events.1.title: "Honkai: Star Rail Mod Overview"
 HSR_events.1.desc: "#G Welcome aboard, Trailblazer!#!\n\n#E How to Use:#!\nBuild the Astral Express Station in your capital to begin experiencing this mod.\n\n#E Building Astral Express:#! The dwelling of the Astral Express on the land, where Trailblazers reside, helping the locale open up new wastelands and prosper!\nThe Astral Express Station must first be built in the capital (headquarters), before it can be built in locales (branch stations).\nBuilding it in the capital provides the whole country with [colonization|e] and exploration support; building it in a locale aids local pioneering and defense, and drives local prosperity. You can help your subjects build it.\nRequires employing the Pathstriders.\n\n#E International Organization Astral Express:#! Build the Astral Express Station in your capital to join.\nOver time you accumulate Stellar Jade, and can use Stellar Jade to perform Warp.\nIf you help a subject build an Astral Express Station in its capital, the subject will also join this international organization, accumulate Stellar Jade, and recruit characters.\n\n#E Characters and the Pathstrider estate:#!\nCharacters belong to the Pathstrider [estate|e]. After granting [estate_privilege|e], you can hire them into the [cabinet|e], make them a [commander|e], or even make them a [subject|e] or the [ruler|e] of a country.\nThe Astral Express Station requires Pathstriders to function.\nAfter annexing other countries, you gain their characters.\n\n#E Exploration and Colonization:#! The Astral Express grants the locale and the country [colonization|e] capability: the station and headquarters help open new frontiers for the nation, increasing colonial range and migration.\n\n#E UI Discovery:#! Society - Population - Characters\nHere you can browse all the characters you own; remember to check back after Warp!"
 HSR_events.1.a: "\"Per aspera ad astra!\""
 HSR_events.1.b: "EU5 is too hard, I want the beginner subsidy!"
 STATIC_MODIFIER_NAME_HSR_start: "Astral Express Cooperation"
 STATIC_MODIFIER_DESC_HSR_start: "We have established long-term cooperation with the Astral Express. The cooperation fees it pays will be credited to us on a regular basis."
