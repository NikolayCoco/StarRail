 ipc_group_desc: "The Interastral Peace Corporation — a corporate power spanning the stars, guided by profit and the logic of the market."
 family_group_desc: "The Family — a collective that reveres Xipe the Harmony, harboring dream-worlds like Penacony."
 xianzhou_group_desc: "The Xianzhou Alliance — ancient civilization of the Ai'sish, hunting the Abominations aboard great starships."
 punklorde_group_desc: "Punklorde — a gamer's paradise where boundary and meaning are constantly rewired."
 astral_express_group_desc: "The Astral Express — a train traversing the silver rails laid by Akivili, bearing travelers to unknown worlds."
 galaxy_ranger_group_desc: "Galaxy Rangers — a self-formed band of justice, carrying the cruelty of the Hunt for the good of the universe."
 masked_fools_group_desc: "Masked Fools — masked revelers serving Aha the Elation, seeking joy in chaos."
 tavern_group_desc: "The Tavern at the End of the World — haven of the Masked Fools, a gathering place of stories and amusement."
 garden_of_recollection_group_desc: "Garden of Recollection — servants of Fuli, chronicling memory and the forgotten."
 amphoreus_group_desc: "Amphoreus — a world steeped in myth, once a harmonious realm shaped by the Titans, now in ruin."
 genius_society_group_desc: "Genius Society — a gathering of the galaxy's greatest minds, blessed by Nous."
 glamoth_group_desc: "Glamoth — a military nation whose Iron Cavalry repelled the Swarm."
 self_annihilator_group_desc: "Self-Annihilators — a nihilistic faction that turned against the path of Nihility."
 lushaka_group_desc: "Lushaka, the Sunken Seas — a tranquil world steeped in water and memory."
 knights_of_beauty_group_desc: "Knights of Beauty — knights seeking Idrila, the Aeon of Beauty."
 belobog_group_desc: "Belobog — a planet enduring an eternal winter beneath the ice, divided between Overworld and Underworld."
 new_babylon_group_desc: "New Babylon — the world that bore Kafka and the Legion, named for its quest."
 planarcadia_group_desc: "Planarcadia — a planar arcadia of the secondary dimension, where reality and fantasy entwine."
