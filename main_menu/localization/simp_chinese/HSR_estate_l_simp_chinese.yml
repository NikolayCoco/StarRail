l_simp_chinese:
 hsr_trailblazer: "开拓者"
 hsr_trailblazer_desc: "他们来自银河的各个角落——曾被命运抛向星海，却都选择与星穹列车同行。\n如今，他们跨越世界来到我们身边，愿意为我们的国家奉献技艺与忠诚。"
 hsr_pop: "开拓者"
 hsr_pop_desc: "这些开拓者代表来自星穹列车的旅人。"
 MODIFIER_TYPE_NAME_hsr_trailblazer_target_satisfaction: "$hsr_trailblazer$满意度均衡点"
 MODIFIER_TYPE_DESC_hsr_trailblazer_target_satisfaction: "这影响该[country|e]$hsr_trailblazer$的[estate_satisfaction_equilibrium|e]。"
 MODIFIER_TYPE_NAME_hsr_trailblazer_satisfaction_decay: "$hsr_trailblazer$满意度衰减"
 MODIFIER_TYPE_DESC_hsr_trailblazer_satisfaction_decay: "这影响该[country|e]的$hsr_trailblazer$的[estate_satisfaction|e]衰减至[estate_satisfaction_equilibrium|e]的速度。"
 MODIFIER_TYPE_NAME_hsr_trailblazer_satisfaction_recovery: "$hsr_trailblazer$满意度恢复"
 MODIFIER_TYPE_DESC_hsr_trailblazer_satisfaction_recovery: "这影响该[country|e]的$hsr_trailblazer$的[estate_satisfaction|e]恢复至[estate_satisfaction_equilibrium|e]的速度。"
 MODIFIER_TYPE_NAME_global_hsr_trailblazer_power: "$hsr_trailblazer$[estate_power|e]"
 MODIFIER_TYPE_DESC_global_hsr_trailblazer_power: "这影响整个[country|e]的$hsr_trailblazer$的[estate_power|e]。"
 MODIFIER_TYPE_NAME_local_hsr_trailblazer_power: "本地$hsr_trailblazer$[estate_power|e]"
 MODIFIER_TYPE_DESC_local_hsr_trailblazer_power: "这影响该[location|e]的$hsr_trailblazer$的[estate_power|e]。"
 MODIFIER_TYPE_NAME_hsr_trailblazer_allowed_in_cabinet: "$hsr_trailblazer$允许在内阁任职"
 MODIFIER_TYPE_DESC_hsr_trailblazer_allowed_in_cabinet: "这允许[ShowEstateTypeName('hsr_trailblazer')][estate|e][characters|e]在[cabinet|e]任职。"
 MODIFIER_TYPE_NAME_hsr_trailblazer_allowed_leading_military: "$hsr_trailblazer$允许指挥军队"
 MODIFIER_TYPE_DESC_hsr_trailblazer_allowed_leading_military: "这允许[ShowEstateTypeName('hsr_trailblazer')][estate|e][characters|e]担任[generals|e]或[admirals|e]。"
 hsr_trailblazer_satisfaction: "[ShowEstateTypeName('hsr_trailblazer')][estate_satisfaction|e]"
 hsr_trailblazer_power: "[ShowEstateTypeName('hsr_trailblazer')][estate_power|e]"
 hsr_trailblazer_base: "整合开拓者社群"
 hsr_trailblazer_base_desc: "旅人们来自银河各地，风俗各异。为了让他们在国家事务中更好地发挥作用，我们应当整合散布的开拓者社群，给予他们正式的编制与待遇。\n#G 这是其他特权的基础。#!"
 hsr_trailblazer_physical: "重用@physical!物理角色"
 hsr_trailblazer_physical_desc: "@physical!物理系角色凭借健壮体魄正面迎敌。他们的训练可以提升我们的陆军战力与动员能力。"
 hsr_trailblazer_fire: "重用@fire!火属性角色"
 hsr_trailblazer_fire_desc: "@fire!火属性角色以炽热攻势摧毁敌阵。他们的战斗方式可以提升攻城与火力压制能力。"
 hsr_trailblazer_ice: "重用@ice!冰属性角色"
 hsr_trailblazer_ice_desc: "@ice!冰属性角色以寒冰凝固战线。他们的经验可以强化防御工事，减少部队损耗。"
 hsr_trailblazer_lightning: "重用@lightning!雷属性角色"
 hsr_trailblazer_lightning_desc: "@lightning!雷属性角色以雷霆突袭切入战场。他们的战术可以提升骑兵与机动部队的威力。"
 hsr_trailblazer_wind: "重用@wind!风属性角色"
 hsr_trailblazer_wind_desc: "@wind!风属性角色身轻如风，来去无踪。他们的战法可以显著提升部队的调度速度。"
 hsr_trailblazer_quantum: "重用@quantum!量子属性角色"
 hsr_trailblazer_quantum_desc: "@quantum!量子属性角色操纵时空的奥义。他们的能力有助于安邦定国、维护秩序。"
 hsr_trailblazer_imaginary: "重用@imaginary!虚数属性角色"
 hsr_trailblazer_imaginary_desc: "@imaginary!虚数属性角色参悟虚数之理。他们的研究可以启发我们的科研，并加固军备。"
 hsr_trailblazer_leader: "给予开拓者军事指挥权"
 hsr_trailblazer_leader_desc: "允许开拓者领军打仗。"
 hsr_trailblazer_advisor: "给予开拓者顾问权"
 hsr_trailblazer_advisor_desc: "允许开拓者建言献策。"
 hsr_trailblazer_rule: "给予开拓者执政权"
 hsr_trailblazer_rule_desc: "允许开拓者主政一方乃至于领导整个国家。\n#G 允许开拓者成为国家统治者。#!\n#G 允许派遣开拓者治理附庸国。#!"
