l_simp_chinese:
 Aeons: "命途"
 Destruction_Worship: "毁灭"
 Destruction_Worship_ADJ: "毁灭"
 Destruction_Worship_desc: "@destruction! #italic 「如果熵增是宇宙不可逆转的法则，热寂是物质世界难以逃避的命运，那我们又何苦挣扎？燃烧，聚变，然后湮灭。若想迎接新生，就必先投身终结。」——收集自某位科学家按下核爆的按钮前，琥珀2152纪#!\n\n宇宙的诞生是一种错谬；文明若是浩瀚群星中悄然兴起的癌症，纷争即智慧生灵间唯一通行的语言。\n为了修正如是错误，抹去宇宙的污点，纳努克成为熵之化身，怀抱对列神的否定飞升成神。\n「毁灭」并非过程，而是结果。在祂允诺的道路上，一切命途星神都将在热寂中终结。"
 Hunt_Worship: "巡猎"
 Hunt_Worship_ADJ: "巡猎"
 Hunt_Worship_desc: "@hunt! #italic 「仇忾无涯，征逐无疆，猎君几多愁？ 辰矢在弦，金瞳炽焱，帝弓莫回首。」——仙舟，《寰宇通鉴》#!\n\n被称为帝弓司命的游弋星神，无止尽地游荡于诸世界之间，铲除曾荼毒其家园的不死孽物。\n岚的游猎从来不计代价，其拯救和破坏也几无差别。"
 Erudition_Worship: "智识"
 Erudition_Worship_ADJ: "智识"
 Erudition_Worship_desc: "@erudition! #italic 「假使宇宙的真理残酷而无趣，你依然渴求答案吗？\n——求知者不置可否，因他的机核自出生起便淡漠冰冷…一如它所追寻的命途终点。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n万物皆是疑问，一切必有解答。\n原为用于求解万物的星体计算机，由机器升格而成的星神。\n博识尊试图体认宇宙，解开万物之谜。"
 Harmony_Worship: "同谐"
 Harmony_Worship_ADJ: "同谐"
 Harmony_Worship_desc: "@harmony! #italic 「普世同谐，群星共熠，无上功德颂神主！世人同袍，万物同根，赐福之风拂大地！」——《谐乐颂》第一乐章#!\n\n来自多个谐乐天体世界的集群星神。千面一体的希佩，宣唱着和谐一致的喜乐。\n为了对抗宇宙无情的法则，智慧生命需要抹煞孱弱的私欲与个体的差别，融入同一阙谐乐中——以强援弱，以死护生。"
 Nihility_Worship: "虚无"
 Nihility_Worship_ADJ: "虚无"
 Nihility_Worship_desc: "@nihility! #italic 「你尽可仰望璀璨的繁星，但切忌凝视虚无的深渊…那片黑雾中空无一物，仅一瞥便足以令凡人摒弃理智。」——混沌医师慕榕#!\n\n「虚无」的存在是一个谜，祂的形象被层层叠叠的迷雾包裹着。\nⅨ不与其他星神往来，祂相信多宇宙的本质乃是虚无，因而存在毫无价值。"
 Preservation_Worship: "存护"
 Preservation_Worship_ADJ: "存护"
 Preservation_Worship_desc: "@preservation! #italic 「哲思者仰望星河，探求文明的终极目标——『筑墙，』雄浑的回声响彻脑海：『筑墙。』」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n天慧星墙、亚空晶壁、巨引源基盘的砌造者，崇拜者称其「琥珀王」。其为更古老的「黄昏战争」的幸存者。\n祂知晓大敌的吞噬迫在眉睫。因此不得不以光年为单位铸造障壁加以封印，隔绝保护尚有生机的世界。"
 Abundance_Worship: "丰饶"
 Abundance_Worship_ADJ: "丰饶"
 Abundance_Worship_desc: "@abundance! #italic 「花儿肆意绽放，迎向无法逃避的凋零；鸟儿展翼啼唱，飞向无法逃避的坠落；溪儿潺潺淙淙，淌向无法逃避的干涸——缘何万物必要消亡？宇宙间必有一方灵药，足以医治名为『短寿』的顽疾。」——佚名，《此生苦短》#!\n\n令诸有情，所求皆得。\n药师是众生哺育者，乐土之神，旨在令生命兴盛不熄。\n祂是从不拒绝祈愿，不忍视衰亡和病痛的星神。"
 Remembrance_Worship: "记忆"
 Remembrance_Worship_ADJ: "记忆"
 Remembrance_Worship_desc: "@remembrance! #italic 「时间——世上最勤劳的窃贼。它不断偷走我们的当下，随手扔进名为『记忆』的仓库。有人沉溺于招领失物…有人对遗失毫不在乎。」——佚名，《此生苦短》#!\n\n世间再无比纯粹的记忆更加包容的存在：它记录一切，不嫌恶，不偏爱；它无私地保留每个基本的事实，每种绮丽的姿态；它是绵延的生命汇聚成的河流，是亘古的智慧堆砌成的宝藏。\n——而浮黎是溯游的鱼群，亦是宝库的钥匙。祂禅坐于净土中央，静观世间万物不知疲倦地重蹈覆辙。"
 Elation_Worship: "欢愉"
 Elation_Worship_ADJ: "欢愉"
 Elation_Worship_desc: "@elation! #italic 「花儿肆意绽放，迎向无法逃避的凋零；鸟儿展翼啼唱，飞向无法逃避的「智识是坨废铁，存护是个呆子；巡猎毫无幽默感，毁灭像个疯子。星神都一根筋，阿哈真没面子！」——某位通晓天文（自称）的假面愚者#!\n\n懂得欢乐是智慧生灵独有的权利。顽石与星辰都无从体察生命的幽默。\n寻求棋逢对手的敌人，寻求消磨光阴的游戏，寻求不问胜负的结局。\n寻求捧腹绝倒的笑谈，寻求阴差阳错的误会，寻求神思飞舞的歌谣。"
 Voracity_Worship: "贪饕"
 Voracity_Worship_ADJ: "贪饕"
 Voracity_Worship_desc: "@voracity! #italic 「虫蚁之于飞禽，野兔之于狼犬，星尘之于黑洞，诸界之于贪饕。」——仙舟，《寰宇通鉴》#!\n\n诸界渴饮者，永无餍足的吞噬者，会思考的黑洞。既是星神，又是古兽的双重存在。\n在奥博洛斯看来，生命是虚空海洋中明灭的浮藻，终将随着诞生它们的星辰归于黑暗——这片黑暗就在祂的口中。"
 Beauty_Worship: "纯美"
 Beauty_Worship_ADJ: "纯美"
 Beauty_Worship_desc: "@beauty! #italic 「几尺布绸为美，几行散诗为美，几串音符为美——欢迎来到『美』之赞誉一文不值的年代！庸俗，无奈，悲哀！」——《银河潮流指南》主编米舍利娜•冯•塔伦蒂诺#!\n\n在诡丽变换的宇宙图景中，伊德莉拉窥见了世界存在的终极意义：人们谓之「美」的存在。\n星神「纯美」在某一日突然失踪，祂的消失与其诞生一样神秘。"
 Propagation_Worship: "繁育"
 Propagation_Worship_ADJ: "繁育"
 Propagation_Worship_desc: "@propagation! #italic 「如果正午的天边浮现了黑影，闭紧你的房门——那不是提前到来的夜色，而是饥肠辘辘的虫群。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n塔伊兹育罗斯，又称「虫皇」、「沙王」，寰宇蝗灾的创造者。\n作为统治大地的鞘翅目的最后一员，孤独的渴望点燃了祂的命途。塔伊兹育罗斯化为自我复制的恐怖，无尽繁衍的荒潮。祂——或者说——祂们横行诸界，直到命运以某种方式阻止了祂的前进。"
 Enigmata_Worship: "神秘"
 Enigmata_Worship_ADJ: "神秘"
 Enigmata_Worship_desc: "@enigmata! #italic 「放弃追问如同豪雨放弃星辰的虔诚，放任隐喻的洪流穿过你的身体。你将看到星空尽头的真相，空萦玫瑰色的迷霁。」——星之桂冠诗人（自称）沙伦•莱德#!\n\n万物皆可体认乃是一派妄言，生命仅凭对规律的有限把握便开始推算未解之事，殊不知宇宙不可穷解，真理乃是幻觉。\n为防止智识的确定性毁灭可能的变量，迷思降下思想之雾和感官之雨，通过色相、叠嶂、谜语、幻象，向世人昭示不可概述的奥理。"
 Equilibrium_Worship: "均衡"
 Equilibrium_Worship_ADJ: "均衡"
 Equilibrium_Worship_desc: "@equilibrium! #italic 「我偷偷拿走金色的砝码，为激起的涟漪洋洋得意；祂总能看穿我的诡计，星星又将游码归零。」——阿德里安•斯宾塞—史密斯，《有关星空的寓言集》#!\n\n凡人挂于唇齿的因果链条，不过是对事态背后繁杂拓扑的粗略概括——「互」将自身的意志溶于宇宙运移逻辑的脉络之中，永恒维系着世间万物的平衡、稳固。\n好事者孜孜不倦地寻找系统中的纰漏，以为智慧凌驾于星神之上；殊不知自身早已沦为被监视的数串，逃不出祂编织的精密网络。"
 Finality_Worship: "终末"
 Finality_Worship_ADJ: "终末"
 Finality_Worship_desc: "@finality! 执掌「终末」命途的星神，在「四末说」的任何一种可能到来时便会诞生，逆时而行。\n彼时，他会将全部的神力化作漆黑猫群，穿行于宙域之间，喃喃宣布着必将实现的预言。"
 Order_Worship: "秩序"
 Order_Worship_ADJ: "秩序"
 Order_Worship_desc: "@order! 祂统治下的星球，对规则的捍卫十分古板，但必须承认：在太一的庇护下，银河灾祸皆被牵制，因而星球的文明建设空前高效。但有趣的是，也因「秩序」，文明发展到一定程度反而会触底：那些极度崇尚「秩序」的古星都闪耀过，接着又全盘覆灭了…这或许是星球的「命途」也说不定。「秩序」的太一仍守护众生的时期着实闪耀，祂神迹拂过之处，总有天外合唱班的歌声渺渺，那些音符呈现立体的纵向排列——而其组成的圣歌，即是祂自己的声音。"
 Permanence_Worship: "不朽"
 Permanence_Worship_ADJ: "不朽"
 Permanence_Worship_desc: "@permanence! 执掌「不朽」命途的古老星神，已陨。\n过去多以巨龙的形态现身，曾留下数目众多的子嗣，即「龙裔」。"
 Trailblaze_Worship: "开拓"
 Trailblaze_Worship_ADJ: "开拓"
 Trailblaze_Worship_desc: "@trailblaze! #italic 「无数流星划过今夜的天空…如果选中了正确的那一颗，它将把你的愿望带向千百个世界。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n命运的罗盘上标着三个方向：未知、已知和不可知。可以忍受「未知」，却绝不能屈服于「不可知」。\n阿基维利离开孤绝世界裴伽纳，不断开拓着宇宙未知的边界，试图找寻存在之树的端点。但祂的命运因意外而终结。"
