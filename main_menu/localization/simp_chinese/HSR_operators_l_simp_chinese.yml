 desc_HSR_tingyun_01_trait: "@lightning! 小女子名作停云，「罗浮」天舶司商团接渡使。接下来还要多多仰仗恩公啦。"
 desc_HSR_tingyun_01_trait_leader: "@harmony! 客人嘛，岂有不招待的道理。"
 desc_HSR_tohsakarin_01_trait: "@quantum! 契约完成。别担心，我不喜欢那种阶级分明的关系…至少对绝大多数人是这样啦。记好了吗，我的从者？"
 desc_HSR_tohsakarin_01_trait_leader: "@erudition! 优雅、从容，全力以赴！"
 desc_HSR_topaz_01_trait: "@fire! 初次见面，请容许我做个简单的自我介绍。我叫托帕，隶属星际和平公司的战略投资部。星穹列车和无名客，各位的事迹我早有耳闻，幸会！身边这位，就是我的好搭档啦。账账，来和大家打个招呼！"
 desc_HSR_topaz_01_trait_leader: "@hunt! 开始吧，资产评估。"
 desc_HSR_tribbie_01_trait: "@quantum! 缇宝：*我们*是缇宝——传递预言的「信使」~缇安：*我们*是缇安——穿梭百界的「门匠」！缇宁：*我们*是缇宁——聆听神谕的「祭司」。缇宝&缇宁&缇安：*我们*是缇里西庇俄丝——「雅努萨波利斯的圣女」，欢迎和我们同行，一同到达鲜花芬芳的西风尽头。"
 desc_HSR_tribbie_01_trait_leader: "@harmony! 小瞧我们可是会吃亏的。"
 desc_HSR_welt_01_trait: "@imaginary! 你好，我是瓦尔特•杨，遇到任何困难，欢迎随时来找我。"
 desc_HSR_welt_01_trait_leader: "@nihility! 接下来，就交给我吧。"
 desc_HSR_xueyi_01_trait: "@quantum! 十王司判官，雪衣。奉十王诰谕还阳行事。有事便讲，吾的时间不多。"
 desc_HSR_xueyi_01_trait_leader: "@destruction! 时辰已至。"
 desc_HSR_yanqing_01_trait: "@ice! 「罗浮」云骑军骁卫彦卿，前来报到！开拓者老师有空的话，就来同彦卿切磋一下吧？放心，我可不会因为对手是老师您就手下留情。"
 desc_HSR_yanqing_01_trait_leader: "@hunt! 哦？你能接我几招？"
 desc_HSR_yaoguang_01_trait: "@physical! 我是爻光，仙舟「玉阙」的戎韬将军，你就同他人一样，叫我「爻老板」吧。此次会面，诸般细节本可用卜算预见，但本座还是更想亲身经历一番——果然，有许多意外之喜。"
 desc_HSR_yaoguang_01_trait_leader: "@elation! 卜签告诉我，你会受些皮肉之苦。"
 desc_HSR_yukong_01_trait: "@imaginary! 你好，「星穹列车」的客人，我是「罗浮」天舶司的驭空，欢迎来到仙舟做客。"
 desc_HSR_yukong_01_trait_leader: "@harmony! 飞行士的斗志，从未熄灭。"
 desc_HSR_yunli_01_trait: "@physical! 我是云璃。来吧，拿上你的剑，我们交一次手，就算认识了。"
 desc_HSR_yunli_01_trait_leader: "@destruction! 胜负在人，而不在剑。"
