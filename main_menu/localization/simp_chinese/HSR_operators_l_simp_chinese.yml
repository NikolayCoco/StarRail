 desc_HSR_acheron_01_trait: "@lightning! 「黄泉」…虽然只是借来的名字，但你知道我是怎样的人，记得我做过怎样的事，如此之后…我便是黄泉。"
 desc_HSR_acheron_01_trait_leader: "@nihility! 来到此处，是你…还是命途的意愿？"
 desc_HSR_aglaea_01_trait: "@lightning! 远道而来的贵客，风儿顺着金丝捎来了你的讯息。我名阿格莱雅，奥赫玛的改衣师，翁法罗斯的黄金裔之一。愿我们坦诚相待。"
 desc_HSR_aglaea_01_trait_leader: "@remembrance! 在紧张么？你的气息乱了。"
 desc_HSR_anaxa_01_trait: "@wind! 我名为阿那克萨戈拉斯，神悟树庭七贤人之一，「智种学派」的创立者。不必我多说了，第一，别叫我那刻夏。第二，别打断我——沉默是金。切记。"
 desc_HSR_anaxa_01_trait_leader: "@erudition! 怎么了？有事吗？"
 desc_HSR_archer_01_trait: "@quantum! 初次见面，叫我Archer就好。幸好你我并不是需要相互厮杀的关系，那就尽可能友好相处吧。"
 desc_HSR_archer_01_trait_leader: "@hunt! 到我了？真是够忙的。"
 desc_HSR_argenti_01_trait: "@physical! 我是「纯美骑士团」的银枝。我谨在此，以一朵玫瑰的沉重份量，向你致意。"
 desc_HSR_argenti_01_trait_leader: "@erudition! 我向一朵玫瑰起誓。"
 desc_HSR_arlan_01_trait: "@lightning! 你好，开拓者，我是空间站「黑塔」的防卫科负责人阿兰，在空间站期间，我会全力护你安全。"
 desc_HSR_arlan_01_trait_leader: "@destruction! 战斗才能取胜。"
 desc_HSR_ashveil_01_trait: "@lightning! 在下是「不死神探事务所」的名侦探不死途，这是事务所的名片。我接取各类委托，不管是寻找走失狗猫，冒充家长参会，或者抓捕星际通缉犯，追查星神的下落——你想委托什么？"
 desc_HSR_ashveil_01_trait_leader: "@hunt! 直觉告诉我，你很可疑。"
 desc_HSR_asta_01_trait: "@fire! 嗨，开拓者，我是空间站「黑塔」的站长艾丝妲。要你帮忙的时候，我一定告诉你…你放心，不和你客气。"
 desc_HSR_asta_01_trait_leader: "@harmony! 真是不懂礼貌的客人。"
 desc_HSR_aventurine_01_trait: "@imaginary! 不才「砂金」，隶属星际和平公司战略投资部，不良资产清算专家之一…当然，也可以是你的朋友。"
 desc_HSR_aventurine_01_trait_leader: "@preservation! 准备下注。"
 desc_HSR_aventurinewaveflair_01_trait: "@quantum! 朋友，又见面了！刚刚结束代言拍摄，在镜头前维持笑容还真是个体力活。不过好在升完P46之后，总算有空好好休假了。想和我一起放松下么？我保证会给你一个难以忘怀的假期。"
 desc_HSR_aventurinewaveflair_01_trait_leader: "@elation! 暗流汹涌…该入场了。"
 desc_HSR_bailu_01_trait: "@lightning! 我是白露，丹鼎司的医士。来来，过来让我瞅瞅，你怎么回事，哪儿不舒服啦？"
 desc_HSR_bailu_01_trait_leader: "@abundance! 哎哟你病得不轻啊！"
 desc_HSR_blackswan_01_trait: "@wind! 开拓者？有趣的名字，唔，还有难以看穿的命运。"
 desc_HSR_blackswan_01_trait_leader: "@nihility! 命运，并非一种选择。"
 desc_HSR_blade_01_trait: "@wind! 开拓者…我不认识你。这对你而言，是件好事。"
 desc_HSR_blade_01_trait_leader: "@destruction! 以掌中之剑，送你一程。"
 desc_HSR_boothill_01_trait: "@physical! 我叫波提欧。听说过我的人都知道我是干什么的，没听说过我的人…为你的小命着想，最好永远也别听说。"
 desc_HSR_boothill_01_trait_leader: "@hunt! 排队来吃枪子儿啦？"
 desc_HSR_bronya_01_trait: "@wind! 我是贝洛伯格「大守护者」继承人，代行银鬃铁卫统领，布洛妮娅•兰德…方才只是例行的自我介绍，叫我布洛妮娅就好。"
 desc_HSR_bronya_01_trait_leader: "@harmony! 这一战，不可避免。"
 desc_HSR_castorice_01_trait: "@quantum! 欢迎来到奥赫玛，我是遐蝶。抱歉，与他人保持一定距离是我的习惯…如果阁下愿意，我自然可以站近些。"
 desc_HSR_castorice_01_trait_leader: "@remembrance! 生命并非如蝶翼般易折。"
 desc_HSR_cerydra_01_trait: "@wind! 「燃冕者」、「独裁官」、「女皇」、「总帅」、「凯撒」…世人给予我的头衔林林总总，但你不妨直呼我的本名——刻律德菈。"
 desc_HSR_cerydra_01_trait_leader: "@harmony! 若世界总是非黑即白，也略感无趣。"
 desc_HSR_cipher_01_trait: "@quantum! 赛法利娅？你认识我啊…不过，现在很少有人提起这个名字了。你叫我赛飞儿吧，听起来就比风还快，侠盗得很，对吧？"
 desc_HSR_cipher_01_trait_leader: "@nihility! 打个商量，躺平一点，我好早点收工~"
 desc_HSR_clara_01_trait: "@physical! 克拉拉：你好…我是克拉拉，可以成为我的家人么…就像史瓦罗先生一样。史瓦罗：有我在，开拓者就是你的家人。"
 desc_HSR_clara_01_trait_leader: "@destruction! 克拉拉：克拉拉要勇敢一点…"
 desc_HSR_cyrene_01_trait: "@ice! 这是命运的邂逅吗，还是…久别重逢呢？真让人心跳加速呀，那…就像初遇时那样，再一次呼唤我「昔涟」，好吗？"
 desc_HSR_cyrene_01_trait_leader: "@remembrance! 嘻，到人家表现啦♪"
 desc_HSR_dahlia_01_trait: "@fire! 你的记忆…还真是棘手呢，那不妨从我敞开心胸开始——我的名字是康士坦丝，那些跪倒于我裙摆下的人称我为「大丽花」。别怕，随我来吧，在这场只属于你我的双人舞中，你会知道，过去如何被焚烧，未来又如何被埋葬……"
 desc_HSR_dahlia_01_trait_leader: "@nihility! 亲爱的，还有什么遗言吗？"
