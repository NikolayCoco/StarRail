l_simp_chinese:
 HSR_events.1.title: "崩坏：星穹铁道mod相关说明"
 HSR_events.1.desc: "#G 欢迎登车，开拓者！#!\n\n#E 【使用方法】#!\n在首都建造建筑星穹列车停靠站，即可开始体验本mod的内容。\n\n#E 建筑星穹列车：#!星穹列车在大地的居所，开拓者于此驻留，帮助地方开拓荒土、繁荣民生！\n星穹列车停靠站需先在首都建造（总站台），方可在地方建造（分站台）。\n建造在首都可为全国提供[colonization|e]与探索支援，在地方建造可为当地开拓与防护，并带动地方繁荣。可以帮助附庸建造。\n需要雇佣「命途行者」。\n\n#E 国际组织星穹列车：#!在首都建造建筑星穹列车停靠站即可加入。\n随时间可以积累星琼，使用星琼可以进行跃迁。\n若帮助附庸在首都建造星穹列车停靠站，则附庸也会加入该国际组织、积累星琼、招募角色。\n\n#E 角色与「命途行者」阶层：#!\n角色从属于「命途行者」[estate|e]。授予[estate_privilege|e]后便可将其雇佣进入[cabinet|e]或成为[commander|e]，甚至于成为[subject|e]或国家的[ruler|e]。\n建筑星穹列车停靠站需要雇佣「命途行者」才能工作。\n吞并其他国家后，可以获得其角色。\n\n#E 探索与殖民：#!星穹列车能为地方与本国提供[colonization|e]能力：停靠与总部可为国内开拓新天地助力，提高殖民范围与迁移。\n\n#E UI大发现：#!社会-人口-角色\n在这里你可以浏览所拥有的所有角色，跃迁获得角色后记得去查看哟~"
 HSR_events.1.a: "「愿此行，终抵群星！」"
 HSR_events.1.b: "EU5太难辣，我要领新手补贴！"
 STATIC_MODIFIER_NAME_HSR_start: "星穹列车合作"
 STATIC_MODIFIER_DESC_HSR_start: "我们已与星穹列车建立了长期合作。列车支付的合作费用将定期入账。"
