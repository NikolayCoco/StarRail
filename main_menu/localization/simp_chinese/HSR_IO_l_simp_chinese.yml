l_simp_chinese:
 HSR_express_IO: "星穹列车"
 HSR_express_IO_desc: "#italic 「愿此行，终抵群星！」#!"
 HSR_express_desc: "星穹列车与我们在星海间相遇。车上载着来自不同世界的旅人。他们愿与我们同行，去往未知的星球，也愿意为我们的国家奉献技艺与忠诚。"
 HSR_express_IO_hint_title: "$HSR_events.1.title$"
 HSR_express_IO_hint_desc: "$HSR_events.1.desc$"
 HSR_StellarJade: "@StellarJade! 星琼"
 HSR_StellarJade_desc: "如同流星般划过夜空的珍贵光芒，在它熄灭前抓住它，然后换些什么吧？\n#italic 「听说那是智慧生命的愿望化成了流光。尽管在时间的洪流中转瞬熄灭，但它也照亮了片刻黑暗，对吧？」#!"
 HSR_Pay_30: "@SupplyPass! 购买列车补给凭证"
 HSR_supply_text: "列车为开拓者们准备的支援物资，凭证领用。\n#italic 「列车长，咱能不能商量下别在卡上打孔呀，我还指着集齐一套收藏呢。」#!"
 HSR_Pay_30_desc: "@SupplyPass!$HSR_supply_text$\n\n#italic @SupplyPass!最有性价比的月卡！#!"
 HSR_Pay_30_desc_2: "花费#N -30#!@gold!，立即获取#P 300#!@StellarJade!，并获得#italic 列车补给凭证@SupplyPass!#!：每月额外获得#P 90#!@StellarJade!，持续30个月。"
 HSR_Pay_30_tooltip_1: "获得#P 300#!@StellarJade!"
 HSR_Pay_30_tooltip_2: "获得#italic 列车补给凭证@SupplyPass!#!，每月额外获得#P 90#!@StellarJade!，持续30个月。"
 HSR_Pay_648: "一次性补给星穹列车"
 HSR_Pay_648_desc: "泛浮在星辰大海中的结晶微光，律动着古老巨兽的遗梦。旧日的一切最终成了照亮黑暗前路的烛火。\n\n#italic @GenesisCrystal!双倍福利，永不过期！#!"
 HSR_Pay_648_desc_2: "花费#N -648#!@gold!，立即获取#P 12960#!@StellarJade!。"
 HSR_Pay_648_tooltip: "获得#P 12960#!@StellarJade!"
 HSR_StellarJade_Change: "每月变化"
 HSR_StellarJade_Change_Value: "每月固定获得#P 60#!@StellarJade!，若购买过#italic 列车补给凭证@SupplyPass!#!，会每月额外获得#P 90#!@StellarJade!。"
 HSR_has_Welkin_text: "（列车补给凭证剩余[GetPlayer.MakeScope.GetVariable('HSR_Welkin_months').GetValue]个月）"
 HSR_create_character: "跃迁角色"
 HSR_create_character_desc: "星穹列车的直达车票。记录着特定世界的坐标，适合目标明确的乘客。\n#italic 「有许久不见的朋友吗？搭上列车和他/她/它/祂一同游历吧！」#!\n\n#italic @IntertwinedFate!邀请一位崩铁角色加入我们的国家！#!"
 HSR_exist_operator_tooltip: "存在可以跃迁的角色"
 HSR_create_character_random_tooltip: "随机#P 获得一位#!角色。"
 HSR_create_pop: "跃迁命途行者"
 HSR_create_pop_desc: "星穹列车的通行车票。顺着星轨一路前行，在通航的世界间游历。\n#italic 「随心所欲地去任何想去的地方，见想见的人，留下想要的回忆。」#!\n\n#italic @AcquaintFate!邀请命途行者来添补我们星穹列车站台的空缺。#!"
 HSR_create_pop_tooltip: "为一处星穹列车据点补充#P 10#!名开拓者（若据点未满编）。"
 HSR_Pay_1600_tooltip: "花费#N -1600#!@StellarJade!。"
 HSR_StellarJade_for_golden: "@gold!回收星琼"
 HSR_StellarJade_for_golden_desc: "星琼多余或者需要金币应急时，可将星琼转换为金币。"

