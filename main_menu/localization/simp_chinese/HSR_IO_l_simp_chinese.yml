l_simp_chinese:
 HSR_express_IO: "星穹列车"
 HSR_express_IO_desc: "#italic 「愿此行，终抵群星！」#!"
 HSR_express_desc: "星穹列车与我们在星海间相遇。车上载着来自不同世界的旅人——开拓者、无名客与同行者。他们愿与我们同行，去往未知的星球，也愿意为我们的国家奉献技艺与忠诚。"
 HSR_express_IO_hint_title: "$HSR_events.1.title$"
 HSR_express_IO_hint_desc: "$HSR_events.1.desc$"
 HSR_StellarJade: "@StellarJade!星琼"
 HSR_StellarJade_desc: "出自星穹深处的奇异晶体，是星穹列车与乘客结算的酬劳，也是寰宇间流通的珍贵货币。"
 HSR_StellarJade_Change: "每月变化"
 HSR_StellarJade_Change_Value: "每月固定获得#P 60#!@StellarJade!。若购买过#italic 空月祝福#!，则在 30 个月内每月额外获得#P 90#!@StellarJade!。"
 HSR_Welkin: "@Welkin!空月祝福"
 HSR_Welkin_desc: "星穹列车按月结算的旅伴证。签约后立即获得 #P 300#!@StellarJade!，此后 30 个月每月额外发放#P 90#!@StellarJade!。"
 HSR_has_Welkin_text: "（空月祝福剩余[GetPlayer.MakeScope.GetVariable('HSR_Welkin_months').GetValue]/30个月）"
 HSR_Pay_30: "@Welkin!购买空月祝福"
 HSR_Pay_30_desc: "领取空月祝福：花费#N -300#!@gold!，立即获得 #P 300#!@StellarJade!，并获得#italic 空月祝福#!：此后 30 个月每月额外获得#P 90#!@StellarJade!。"
 HSR_Pay_30_tooltip_1: "获得#P 300#!@StellarJade!"
 HSR_Pay_30_tooltip_2: "获得#italic 空月祝福#!，此后 30 个月每月额外获得#P 90#!@StellarJade!。"
 HSR_Pay_648: "@StellarJade!星琼组合包"
 HSR_Pay_648_desc: "购买星琼组合包：花费#N -6480#!@gold!，获得 #P 12960#!@StellarJade!。"
 HSR_Pay_648_tooltip: "获得#P 12960#!@StellarJade!"
 HSR_create_character: "@Warp!跃迁"
 HSR_create_character_desc: "星穹列车的跃迁引擎能跨越星海，从另一头带回与你同行之人。这一次，它带来的是谁？"
 HSR_exist_operator_tooltip: "存在可以跃迁获得的角色"
 HSR_create_character_random_tooltip: "随机#P 获得一位#!角色。"
 HSR_create_pop: "开拓者登记"
 HSR_create_pop_desc: "向一处星穹列车据点登记新的开拓者，令其成员时刻保持充足。"
 HSR_create_pop_tooltip: "为一处星穹列车据点补充#P 10#!名开拓者（若据点未满编）。"
 HSR_StellarJade_for_golden: "@gold!星琼兑换金币"
 HSR_StellarJade_for_golden_desc: "星琼富余或急需金币时，可将星琼按 1:10 兑换为金币。"
 HSR_Pay_1600_tooltip: "花费#N -1600#!@StellarJade!。"
