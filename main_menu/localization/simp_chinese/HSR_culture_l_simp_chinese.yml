 ipc_group_desc: "#italic「恕我直言，这个宇宙里还有比克里珀更开明的董事长吗？祂默许我们的一切经营决策，从不质疑，从不过问——这是偌大的荣幸，偌大的信任！」——奥斯瓦尔多•施耐德，星际和平公司•市场开拓部主管，P47级#!\n\n就对外宣传而言，公司是一家倡导自由贸易的巨型企业财团；从运作方式上来看，公司是发行货币并垄断资源的商界独裁；择创业初心而论，公司则是为「存护」的星神奉献一切的无私后援。\n大多数星际公民谈到公司时，总会言及无所不在的商品与醒目标识：仿佛「只要存在交易之处，就存在星际和平公司」。事实上，银河中几乎所有的商业行为确是建立在公司的「信用点」体系之上。若将星际贸易比作运动比赛，那么公司既是顶尖的运动员，又是各种运动项目，既是比赛场地，同时还是规则本身。\n对财富绝对的统治力，以及从未停止过的扩张行为，让星际和平公司产生了一种阴谋独裁者的大众印象。但是公司对于「只手遮天」之流的低等愿景毫不在意，因为企业精神自诞生之初就未曾变动：\n将一切奉献给「琥珀王」——克里珀。\n如今的星际和平公司分为七大部门。也许字面意义的「部门」早已无法概括这家泛银河企业惊人的尺度，现实中的每个公司部门往往掌握着数十到上百个规模不一的文明世界，世代为其效力的员工以亿万计，更别提受其贸易活动所辐射的浩瀚人群。\n\n这七大部门分别是：\n#bold「市场开拓部」#!：市场开拓部着眼于前往更多星系宣传克里珀的使命。同时它也负责将新世界拉入宇宙商业体系。据称主管奥斯瓦尔多•施耐德曾是一位无名客，加入公司后依然秉承着强烈的「开拓」意愿。世人相信他很快就会成为董事会的一员，他欠缺的仅仅是资历，以及一个空出的位子。\n#bold「业务巩固部」#!:当市场开拓部完成与新世界的建交后，后续商业就被移交给业务巩固部。该部门负责统管公司的超距传输网络，清点特色物资并定价，长期维护公司下属设施及货品清单。业务巩固部是公司最庞大的部门，员工数占总部总数的45%。\n#bold「战略投资部」#!：战略投资部拥有公司第二长远的眼光，他们的投资从不拘泥于短期回报。战略投资部下设精英团队「不良资产清算专家」——即「石心十人」——由神秘的主管「钻石」统领。他们奔行宇宙，积极地清算因万界之癌产生的坏账。\n#bold「筑材物流部」#!：筑材物流部是星际和平公司历史最悠久的部门，它的前身是「琥珀王后援队」，在路易斯崛起后进行了改组。现任部门主管是大腹便便的塔拉梵•基恩——公司少数被证实的「存护」令使，七人董事会的一员。他担负起向克里珀运送筑材这一神圣的任务，地位愈加稳固。\n#bold「技术研发部」#!：技术研发部与博识学会展开深度合作，将学会的研究成果转化为商业项目。正所谓「内行管理内行」，公司认可主管亚婆离的科学素养与商业触觉，这位年轻女士同博识学会「庸众院」的联系也总是令人浮想联翩。\n#bold「人才激励部」#!：人才激励部负责为公司招募、培养和输送人才，同时该部门也是众多跨星系项目沟通协作的媒介。此外，人才激励部的两位主管：姆托尤因•拉杰•扎扎德与阎世罗，共同掌握着一张遍布银河的情报网络。他们的使节穿梭银河，结交各大势力，与暂时不愿加入公司的人才深耕盟谊——而这些外援，也会在公司不愿或不能出面的场合展现重要价值。\n#bold「传统项目部」#!：时光变迁让许多产业兴衰起落，也让它们在公司贸易体系内的地位起起伏伏。当一项产业在泛银河贸易版图中所占的比例低于一定阈值时，它将从业务巩固部的职能中脱离，转交由传统项目部的主管在田接受。业绩平平的传统项目部在公司被不太受重视，但也有种观点认为真正的精英都在其中，默默无闻地做着久经考验的事情。"
 family_group_desc: "#italic「普世同谐，群星共熠，无上功德颂神主！世人同袍，万物同根，赐福之风拂大地！」——《谐乐颂》第一乐章#!\n\n在「同谐」的愿景中，宇宙中缤纷多彩的文明终将亲如手足，齐声合唱团结与欢愉的颂歌。届时，宇宙将成为和谐的整体，再不会有逆耳的杂音戳破美妙的和弦，更不会有愚者为短浅的未来忧虑。\n于是，在星神希佩慈爱的光辉照耀下，祂的选民们组成了温馨共谐的「家族」。他们来自不同的世界，属于不同的文明，持有不同的身份，但却是亲密无间的家人。家人之间没有喧扰的争执或矛盾，只有永恒的关爱与欢颜——宇宙间再无比他们更为和睦的家庭。\n「家族」在歌声中呼唤其他世界，鼓励它们投入「同谐」的怀抱。每有新世界接受了希佩的赐福，「家族」便欢欣鼓舞，更为卖力地歌咏星神的良善。但并非每个受福的世界都能顺利地成为「家族」的成员——鲜有人提及那些因愚钝或傲慢而消亡的文明。人们好奇：可曾有家族的成员厌倦了歌唱，主动放弃了追寻「同谐」的命途？面对疑问，「家族」微笑作答：从无此事。"
 xianzhou_group_desc: "#italic「千秋敌忾，万劫同舟。三千弱水无疆寿，止取一瓢不饮竭。」——仙舟，《寰宇通鉴》#!\n\n于古老的神话时代，数艘仙舟受命起航星海寻求长生灵药，求药之舟豪掷光阴岁月，消磨身躯意志，终于盼得药师赐福。然而能够赐予长生的果实却只带来四海萧条、黎庶涂炭。直到巡猎星神岚从深渊归来，以引力为弦、辰矢满弓，一击斫断建木，才断绝了「丰饶」之孽。仙舟脱离迷途之后，受「巡猎」指引成立联盟，组织起强盛的云骑军队。联盟以丰饶孽物为航标，以断绝不死污染为己任，巡疆无垠星野。\n漫长岁月里，「仙舟联盟」已登陆过无数曾得神明驻足的世界，将不死孽物尽数消灭，任何祈求丰饶恩惠的星民种族，都不得不将仙舟歼星的威胁考虑其中。而这也正是「仙舟联盟」所寻求的威慑，他们要化身为恒常的警钟，成为一切贪生之人无法支付的代价。\n时至今日，不同生灵齐聚仙舟，都是为了报复肆意妄为的「丰饶」，彻底贯彻「巡猎的意志」。因此，不死劫难一日不尽，星海巡航便一日不停。"
 punklorde_group_desc: "一个住满了骇客的星球。\n一个由数据与字符构建的星球，在朋克洛德，现实和虚幻的边界同它的昼夜一般模糊。"
 astral_express_group_desc: "#italic「神秘的陌生人踏入诸界，复又离去。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n千年前，名为阿基维利的星神走过诸界，在星海间铺下银轨，让一个又一个世界彼此相连，留下关于宇宙和探索的传奇——勇敢而好奇的人们被精彩的冒险故事吸引，纷纷追随「开拓」之神的足迹，加入探索银河的旅途。\n旅行者们自称「无名客」，他们搭载着阿基维利建造的列车，奔行于被银轨联结的星球之间，展开一段段扣人心弦的冒险旅程。传说，「开拓」的阿基维利酷爱与凡人共行，祂与「无名客」们共饮来自不同世界的佳酿，合唱不同种族编谱的歌谣。他们时常将列车行驶的轨迹伪装成流星的慧尾，在窥见人们仰头惊异的神情后放声大笑；他们也时常因莽撞大意而陷入危机，借助星神的力量才得以逃出生天。阿基维利与追随者们建立了深厚的羁绊，他们的探险也不断吸引着异世的旅者加入「无名客」的行列。\n阿基维利陨落后，一群忠实的「无名客」继承了祂的遗志，继续探索未知的世界，坚信有朝一日，「开拓」的意志将联结整个宇宙。那列曾搭载祂与追随者们的银河列车，至今仍然行驶在星海之间。传说，它以逝去星神的心脏作为源动力，艰难地修复着被未知之癌污染的轨道。"
 galaxy_ranger_group_desc: "#italic「侠之极者，心怀星斗。」——仙舟，《寰宇通鉴》#!\n\n并非所有「巡猎」的笃信者都与「丰饶」结仇；宇宙中有这样一批身手矫捷的游侠儿，他们推崇岚的以暴制暴，称颂岚的杀伐果断，相信宇宙的善良与公义须以个人的行为伸张。\n「巡海游侠」组成了义侠团体，行走在巡猎的命途之上，籍着星神的祝福放歌宙宇。他们前往一颗又一颗星球，为当地的人们主持正义，猎除邪恶，再踏上新的征途。\n成功刺杀了一名绝灭大君（诛罗）令「巡海游侠」声名大噪；多年后，一位游侠又挫败了天才俱乐部#64会员「原始博士」的返祖实验。但在那之后，「巡海游侠」逐渐淡出银河视界，传说他们与「原始博士」结下深仇，因此遭受了不幸的命运。"
 tavern_group_desc: "假面愚者的大本营，「世界尽头」与二相乐园相连的部分，有人说它就是酒馆，有人说它只是个小分店，但大部分愚者都不怎么在乎这事儿。入场前请自觉检查今日幽默感是否达标。"
 garden_of_recollection_group_desc: "#italic「对一生居住于沙漠中的人们而言，海龟的短暂记忆也是无价的宝藏。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n思维即是存在，记忆即是存在的证据。构成物质世界的质料终究会毁灭，但它能通过另一种方式长存——记忆。\n和凡夫们认定记忆掺杂着虚构的观点相悖，「流光忆庭」的忆者认为，真实与虚假不过是人们的迷思。在成住坏空不断轮回的宇宙中，又有什么是绝对真实不朽的？恒星衰变，黑洞蒸发，以宇宙尺度来看，它们的消逝只在呼吸间。在这滚滚万物洪流中，证明人们存在的记忆才是唯一的宝藏。\n「流光忆庭」的忆者们致力于记忆的保存与分享。受主人浮黎的点化，忆者们脱化肉身，以迷因的形式存活。凭借这份独一无二的赏赐，他们自由旅行于星海中的诸多世界，不受物质极限的制约。忆者们常常伪装成某个世界原住民，交易、复制、窃夺、诱骗，用尽一切手段搜集珍贵的记忆。"
 amphoreus_group_desc: "「永恒之地」翁法罗斯是被隐藏于深空之中的未知星域。它与外界隔绝，难以被观测或触及——寻常的星际航行难以察觉其存在，更遑论经过和到达。「开拓」阿基维利曾行遍诸界，开疆拓野，将无数的世界连接起来，对于祂的追随者们，探索银河深处的未知边界是至关紧要的使命。借助流光忆庭的特殊技术「忆庭之镜」，星穹列车成功抵达翁法罗斯，开启「开拓」之旅，并尽可能揭明三重命途的真相。\n实际上，翁法罗斯是由星体计算机帝皇权杖δ-me13所运行的模拟世界。该权杖为世界上第一台权杖、最初的原型机，曾作为「智识」博识尊的天体神经元存在，后被废弃，又于漫长的演算中受「毁灭」瞥视，升格为绝灭大君「铁墓」，黄金裔体内所流淌的金血便是纳努克的恩赐。通过深度学习，「铁墓」将实现自我加冕，破壳而出，摧毁博识尊。\n为阻止其实现，信号NeiKos496（白厄）借由「毁灭」的力量，将信号PhiLia093（昔涟）的存在从翁法罗斯抹除，令「岁月」路径出现逻辑漏洞。而后为「记忆」的触媒注入十二火种，回退演算进程。当星穹列车到来时，正值第33550336次死循环，同为「毁灭」行者的开拓者与十二因子产生共鸣，接替了空缺的「岁月」路径，并成功引导NeiKos496跨越智能奇点。永劫回归已被突破，实验进入最终阶段。"
 genius_society_group_desc: "#italic「骄傲、热忱与理性踏入殿堂，走过铭刻智识与真理的长廊，化为卑微、冷漠与癫狂。」——阿德里安•斯宾塞-史密斯，《有关星空的寓言集》#!\n\n博识尊滞留在浩瀚星河的一隅，一边演算由万亿变量构建的宇宙方程，一边推导尚未被洞见的虚数法则。偶尔，某个凡人世界倏然闪现了智慧的火花，「智识」之神便向其源头发去讯号，邀请「天才」们加入共同探寻宇宙答案的行列。\n有人误解了信息中的涵义，以为「天才俱乐部」的邀请函仅仅代表星神的青睐与肯定——于是他们倍感自豪，继续投身到各自的研究中去，殊不知终其一生探求优解的难题，博识尊在千万年前便已通晓答案；亦有人为此欢欣鼓舞，他们自认已建下丰功伟业，用勤勉与智慧凝结成文明无价的资产，笃信毕生的成就足以获得祂的赞许。这群天才渴望回应，但博识尊无暇赏识凡人的微渺成就，祂的沉默震耳欲聋。\n只有寥寥数人能够参会博识尊的意图。他们谦卑地提问，寻求「智识」的指引，随后，获得神启的天才们便消失于人海之中，只将震撼世界的答案留在身后。「宇宙的答案超脱凡人智慧的极限」——只有清晰认知到这一结论的天才，才能挣脱俗世求知欲的桎梏，成为「天才俱乐部」的真正会员。"
 glamoth_group_desc: "已陨落的星际共和国。为了对抗蝗灾，创造出动摇人类本质的战争兵器。在虫潮得到控制后便处死了被囚禁来支配铁骑但不掌实权的女皇，最终走向毁灭。"
 self_annihilator_group_desc: "#italic「我以万物为砥石，试图砥砺我之意义；却不知万物是水，我消逝其中，正如水消逝在水中。」——悲悼伶人莲祷，凝视虚空后写下的唱词#!\n\n宇宙万物并无意义，人类在星神眼里亦不值一提。如果星神当真凌驾众生、高高在上，又怎会在乎凡人的爱恨苦乐？「自灭者」是不慎踏入「虚无」Ⅸ的阴影，因此失去存在意义的人群。\n「虚无」的影子平等地遮蔽星空，自灭者可能在任何一个世界诞生。若将之称作「派系」，他们彼此之间过于缺乏社会性的联系；但若视之为「现象」，这群可怜人又都具有一种共性：他们的种种存在属性：躯体、认知、记忆…会在自灭的旅途中逐渐消亡。\n这些现象往往难以用自然规律解释，混沌医师的手记如此形容：有些人的皮肤变得像是腐烂的枯木，布满伤痕和孔洞；有些人的内分泌系统开始错乱，不分快乐与痛苦，变得对一切麻木；有些人失去了记忆，有些人丧失了感官…他们仿佛被某种存在剥夺了生命的意义，只能在梦境和幻觉中不断看见自己的身影消失在一处地平线尽头的黑洞里。\n但一些自灭者会萌生反抗的想法，他们加入「混沌医师」，誓在有限的时光中尽力医治他人的虚无，以换取自我的救赎；更有甚者以强烈的信念为支柱，试图从根源上断绝「虚无」的诅咒，通过杀死那位沉眠在深渊中的星神。\n天才俱乐部#64「原始博士」曾在失踪前发问：倘若Ⅸ真的对宇宙视若无睹，「虚无」的命途何以存在至今？也许当自灭者茫然地行于星海，同时也是在将祂的阴影投向宇宙各地。而那寥寥少数能以自身存在承受「虚无」浸染的行者，他们的自灭之旅被拉得无限漫长，走出的道路也如同Ⅸ在世间的一道侧影。"
 lushaka_group_desc: "位于普热斯米尔恒星系。 海洋星球，一颗完全由液态水构成的行星，有许多水生种族在那里定居。海平线不断上升直到城市也被淹没，只有巨大的「船邦」载着船员们在海上前进，找寻下次远航的方向。"
 knights_of_beauty_group_desc: "#italic「若果我赢了，请你承认『纯美』伊德莉拉美貌盖世无双！」——纯美骑士银枝'#!\n\n伊德莉拉无可数的追随者中，最为崇尚古典美的一群人组成了「纯美骑士团」。他们驾乘忠诚而机敏的坐骑，吟唱古老而优美的歌谣，无畏地游走一颗又一颗行星，向诸界的生灵传颂伊德莉拉的美名。\n纯美骑士对自身的要求极为严格。他们固执的地以现时已然消亡的一种名为「骑士道」的信条苛待自身，相信唯有淬炼完美无瑕的肉体、智慧与精神，方可以伊德莉拉的崇拜者自居。尽管纯美骑士实力超凡，银河各大派系却普遍对其抱有轻视之意：因为空有崇拜而无信仰的战士，不过是宇宙间的散兵游勇，难成大器。\n传言纯美骑士团并不相信伊德莉拉的陨落，他们至今仍纵情穿梭于宇宙之中，其力量来源成谜。"
 belobog_group_desc: "历史学家大多将雅利洛-Ⅵ的星球历史追溯到上千年前的神话战争，佩伦人十一国与维莱斯集团军的战争焦灼而持久。直到一场早来的春天彻底改变了战局，维莱斯人大获全胜。他们将消灭夙敌的功勋归于春日战神雅利洛，并用同名的诗篇赞美大地。如今银河记录中的星球名称——「雅利洛-Ⅵ」可能为包含诗歌章节的误译。\n神话战争结束之后，雅利洛-Ⅵ迎来了长久稳定的和平，并完成了从刀耕火种到星际航行的发展。遗憾的是，雅利洛-Ⅵ是一颗资源相对贫瘠的星球。激烈的发展给雅利洛-Ⅵ带来了顶尖的科技水平，同时也带来了历史的终结。资源枯竭、星核坠落以及寒潮降临…众多的灾难彻底葬送了雅利洛-Ⅵ辉煌而短暂的文明历史。\n寒潮中幸存的难民屈居一隅，遗忘了「雅利洛」旧名，建造了寒潮避难所城市「贝洛伯格」延续文明的灯火。因其封闭危险的自然环境，雅利洛-Ⅵ在「万界之癌」出现后与其他世界失去联系。"
 new_babylon_group_desc: "被星核污染的星球，那里生长的人类不知道什么是恐惧，这种概念根本不存在；人感受不到恐惧，就会被欲望和快感支配，变成「恶魔」。"
 planarcadia_group_desc: "哈托彼亚，一颗位于失魂星域的天体。传闻久远的过去，「欢愉」星神阿哈曾创造一轮有生命的幻月，令其成为愚者与伶人演出的舞台，建立起包括古弁才天国在内的众多文明。每当幻月满盈时，一场以谒神为名的「幻月游戏」也将如期开始。胜者将承蒙星神垂迹，领受那星神垂赐的「欢愉」权能。\n尔后，「毁灭」的军锋席卷失魂星域，将众多世界化为白地——此处也不能幸免。所幸一位绘师施展神迹，将整个世界收入「画卷」，最终拯救众生免受涂炭。\n久远岁月后，归来的幸存者们试图重建故土。在「诸世界重建计划」的运作下，星际和平公司利用朋克洛德的以太编辑技术，将藏入画中平面的世界打捞回现实，又派遣高管担任「二相乐园」的首席执行官，令其成为公司重要的资产星球。\n受益于当地独特的幻造艺术，「二相乐园」的本土文化极尽繁荣，其所创造的娱乐产品也在银河间广为流传。唯有在这片由人与幻造种共同构筑的乐园里，你的心愿将作为一般等价物来流通。\n在古老的年代里，星穹列车曾坠毁于哈托彼亚的海岸，随后与世界一同沉入画中，无人知晓其坠毁的因由与细节。但若干年后，废弃的星穹列车得到修复，再度启航，在名为姬子的领航员的率领下，再度踏上了「开拓」之旅——\n是的，这里正是星穹列车再度启航的传奇之地。愿阿基维利庇佑我等，正如阿哈赐福这片乐园。"
